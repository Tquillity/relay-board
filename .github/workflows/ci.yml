name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the page and the demo
        run: npm run check
      - name: Unit and end-to-end tests
        run: npm test
        env:
          # Preinstalled on ubuntu-latest. Set explicitly so the end-to-end tests never skip here.
          CHROME: google-chrome
