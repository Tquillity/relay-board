<title>Relay Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0e1116;
    --surface: #151a21;
    --surface-2: #1b212a;
    --surface-3: #222a35;
    --line: #262e39;
    --line-soft: #1f2630;
    --text: #e5e8ee;
    --muted: #8a94a3;
    --faint: #5d6776;
    --accent: #8ea8ff;
    --accent-ink: #0e1116;
    --accent-soft: rgba(142, 168, 255, 0.12);
    --ok: #6fcf97;
    --ok-soft: rgba(111, 207, 151, 0.12);
    --wait: #e7b75f;
    --wait-soft: rgba(231, 183, 95, 0.13);
    --bad: #f27a72;
    --bad-soft: rgba(242, 122, 114, 0.13);
    --idle: #7d8796;
    --idle-soft: rgba(125, 135, 150, 0.14);
    --you: #ff9a3c;
    --you-soft: rgba(255, 154, 60, 0.14);
    --radius: 10px;
    --font: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
    --pad: 12px;
    --gap: 10px;
    --row: 6px;
    --fs: 14px;
    --fs-sm: 12px;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    margin: 0;
    color: var(--text);
    font-family: var(--font);
    font-size: var(--fs);
    line-height: 1.5;
    padding-inline: max(16px, 3vw);
    padding-block: 0 48px;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .dim-text { color: var(--faint); }
  .muted { color: var(--muted); }
  button { font: inherit; color: inherit; }

  /* Center the whole page column on wide screens */
  header.top, .usage, nav.tabs, main { width: 100%; max-width: 1280px; margin-inline: auto; }
  header.top {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--bg);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 20px;
    padding-block: 14px 10px;
    border-bottom: 1px solid var(--line-soft);
  }
  .brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; flex: 1 1 auto; min-width: 0; }
  .brand h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .brand .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); align-self: center; }
  .brand .pulse.live { background: var(--ok); animation: pulse 2.4s ease-out infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(111, 207, 151, 0.5); }
    70% { box-shadow: 0 0 0 8px rgba(111, 207, 151, 0); }
    100% { box-shadow: 0 0 0 0 rgba(111, 207, 151, 0); }
  }
  @media (prefers-reduced-motion: reduce) { .brand .pulse.live { animation: none; } }
  .crumb { display: inline-flex; align-items: baseline; gap: 8px; min-width: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--wait); }
  .crumb[hidden] { display: none !important; }
  .crumb .sep { color: var(--faint); font-weight: 400; }
  .crumb .dot { align-self: center; }
  .crumb .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand .sub { color: var(--muted); font-size: var(--fs-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Progress of the selected project's live work: done / 100% − share waiting on you */
  .progress { margin-left: auto; align-self: center; display: inline-flex; align-items: center; gap: 10px; flex: none; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px; }
  .progress[hidden] { display: none !important; }
  .progress .p-nums { display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap; }
  .progress .p-done { font-weight: 600; color: var(--pc); }
  .progress .p-total { color: var(--ok); }
  .progress .p-you { font-weight: 700; color: var(--you); }
  .progress .p-sep { color: var(--faint); }
  .progress .p-bar { position: relative; width: 96px; height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .progress .p-bar i { position: absolute; top: 0; bottom: 0; }
  .progress .p-bar .f-done { left: 0; background: var(--pc); }
  .progress .p-bar .f-you { right: 0; background: var(--you); }
  @media (max-width: 560px) { .progress .p-bar { display: none; } }
  .progress .p-you.zero { color: var(--ok); font-weight: 500; }
  .progress.foil { padding: 3px 10px; border-radius: 999px; border: 1px solid rgba(111, 207, 151, 0.45); background: var(--ok-soft); }

  /* "Foil card" shimmer for projects that are finished for now */
  .foil { position: relative; isolation: isolate; overflow: hidden; }
  .foil::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 1;
    background:
      linear-gradient(115deg, transparent 18%, rgba(255, 94, 196, 0.22) 30%, rgba(94, 214, 255, 0.22) 40%,
        rgba(140, 255, 160, 0.22) 50%, rgba(255, 232, 110, 0.22) 60%, rgba(186, 132, 255, 0.22) 70%, transparent 82%),
      repeating-linear-gradient(55deg, rgba(255, 255, 255, 0.035) 0 2px, transparent 2px 7px);
    background-size: 300% 300%, auto;
    mix-blend-mode: screen;
    animation: foil-sweep 7s ease-in-out infinite;
  }
  .card.foil { border-color: rgba(111, 207, 151, 0.45); box-shadow: 0 0 0 1px rgba(111, 207, 151, 0.12), 0 8px 28px -14px rgba(111, 207, 151, 0.45); }
  .card.foil > * { position: relative; z-index: 2; }
  .all-done { font-size: var(--fs-sm); font-weight: 600; color: var(--ok); }
  @keyframes foil-sweep { 0%, 100% { background-position: 100% 50%, 0 0; } 50% { background-position: 0% 50%, 0 0; } }
  @media (prefers-reduced-motion: reduce) { .foil::after { animation: none; background-position: 40% 50%, 0 0; } }

  /* Plan usage strip */
  .usage { padding-block: 10px; border-bottom: 1px solid var(--line-soft); max-width: 1280px; display: flex; flex-direction: column; gap: 8px; }
  .usage[hidden] { display: none !important; }
  .u-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px 24px; align-items: end; }
  @media (max-width: 720px) { .u-row { grid-template-columns: 1fr; } }
  .u-meter { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .u-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: var(--fs-sm); }
  .u-name { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .u-pct { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 500; }
  .u-track { position: relative; height: 6px; background: var(--line-soft); border-radius: 999px; }
  .u-fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--c, var(--accent)); }
  .u-proj { position: absolute; top: 0; bottom: 0; border-radius: 0 999px 999px 0; background: var(--c, var(--accent)); opacity: 0.22; }
  .u-pace { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--text); opacity: 0.55; border-radius: 1px; }
  .u-status { font-size: var(--fs-sm); color: var(--c, var(--muted)); min-height: 1.5em; }
  .u-ok { --c: var(--ok); }
  .u-warn { --c: var(--wait); }
  .u-bad { --c: var(--bad); }
  .u-early { --c: var(--accent); }
  .u-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: var(--fs-sm); color: var(--muted); white-space: nowrap; }
  @media (max-width: 720px) { .u-side { align-items: flex-start; flex-direction: row; flex-wrap: wrap; gap: 4px 12px; } }
  .u-pill { display: inline-flex; gap: 8px; align-items: baseline; border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; background: var(--surface); color: var(--text); }
  .u-pill .u-name { font-size: 10px; }
  .u-pill.hot { border-color: rgba(231, 183, 95, 0.5); background: var(--wait-soft); }
  .u-more summary { cursor: pointer; font-size: var(--fs-sm); color: var(--muted); width: max-content; }
  .u-charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; padding-top: 8px; }
  .u-chart svg { width: 100%; height: auto; display: block; }
  .u-chart figcaption { font-size: 11px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 4px; }
  .key { display: inline-flex; align-items: center; gap: 6px; }
  .key i { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--k); }
  .key i.dash { border-top-style: dashed; }

  nav.tabs { display: flex; gap: 4px; overflow-x: auto; padding-block: 8px 0; scrollbar-width: thin; border-bottom: 1px solid var(--line-soft); }
  nav.tabs button {
    font-size: var(--fs-sm); font-weight: 600; color: var(--muted); background: transparent; border: 0;
    border-bottom: 2px solid transparent; padding: 6px 12px 8px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px;
  }
  nav.tabs button:hover { color: var(--text); }
  nav.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .count { font-family: var(--mono); font-size: 11px; background: var(--wait-soft); color: var(--wait); border-radius: 999px; padding: 1px 7px; }

  main { display: flex; flex-direction: column; gap: calc(var(--gap) * 1.6); padding-top: calc(var(--gap) * 1.4); max-width: 1280px; }

  .eyebrow {
    font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint);
    display: flex; align-items: center; gap: 10px; margin: 0 0 var(--row);
  }
  .eyebrow .rule { flex: 1; height: 1px; background: var(--line-soft); }
  /* Section headers fold their section; the choice is remembered per browser */
  .eyebrow-btn { all: unset; box-sizing: border-box; flex: 1; display: flex; align-items: center; gap: 10px; cursor: pointer; border-radius: 4px; }
  .eyebrow-btn:hover { color: var(--muted); }
  .eyebrow-btn:hover .rule { background: var(--line); }
  .eyebrow-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .eyebrow .chev { display: inline-block; width: 10px; transition: transform 0.15s ease; }
  .eyebrow-btn[aria-expanded="false"] .chev { transform: rotate(-90deg); }
  @media (prefers-reduced-motion: reduce) { .eyebrow .chev { transition: none; } }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--pad); }

  .btn {
    font-size: var(--fs-sm); font-weight: 600; border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
    border-radius: 7px; padding: 3px 10px; cursor: pointer; min-height: 28px;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.good { background: var(--ok-soft); border-color: rgba(111, 207, 151, 0.4); color: var(--ok); }
  .btn.danger { background: var(--bad-soft); border-color: rgba(242, 122, 114, 0.4); color: var(--bad); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 6px; }
  .btn.ghost:hover { color: var(--text); border-color: var(--line); }
  .btn[disabled] { opacity: 0.5; cursor: default; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  /* Since you last looked */
  .digest { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; border-color: rgba(142, 168, 255, 0.35); background: linear-gradient(90deg, var(--accent-soft), transparent 70%), var(--surface); }
  .digest strong { font-weight: 600; }
  .digest .facts { display: flex; flex-wrap: wrap; gap: 4px 14px; flex: 1 1 auto; font-size: var(--fs-sm); color: var(--muted); }
  .digest .facts b { color: var(--text); font-weight: 600; font-family: var(--mono); }

  /* Needs you */
  .needs { border-color: rgba(231, 183, 95, 0.35); background: linear-gradient(180deg, rgba(231,183,95,0.06), transparent 120px), var(--surface); display: flex; flex-direction: column; gap: 10px; }
  .n-group-h { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0; display: flex; gap: 8px; align-items: center; }
  .needs-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .need { display: flex; flex-direction: column; gap: 4px; padding-block: 8px; border-top: 1px solid var(--line-soft); }
  .needs-list > .need:first-child { border-top: 0; padding-top: 2px; }
  .need-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .need-title { font-weight: 600; }
  .need.done .need-title { color: var(--muted); text-decoration: line-through; }
  .need-why { color: var(--muted); font-size: var(--fs-sm); max-width: 90ch; }
  .need-steps { margin: 2px 0 0; padding-left: 18px; font-size: var(--fs-sm); max-width: 90ch; }
  .need-steps li + li { margin-top: 2px; }
  .answer { display: flex; flex-direction: column; gap: 6px; margin-top: 2px; }
  .answer textarea {
    font: inherit; font-size: var(--fs-sm); color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 8px; min-height: 52px; resize: vertical; width: 100%; max-width: 90ch;
  }
  .answered { font-size: var(--fs-sm); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .answered .you { color: var(--ok); font-weight: 600; }
  .answered q { color: var(--text); }
  .snooze-menu { display: inline-flex; gap: 4px; }
  .collapser { background: none; border: 0; color: var(--muted); font-size: var(--fs-sm); cursor: pointer; padding: 2px 0; text-align: left; }
  .collapser:hover { color: var(--text); }

  .chip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
    text-transform: uppercase; border-radius: 999px; padding: 1px 8px; white-space: nowrap;
  }
  .chip.project { background: var(--accent-soft); color: var(--accent); text-transform: none; letter-spacing: 0; font-size: 12px; }
  .chip.kind { background: var(--surface-2); color: var(--muted); }
  .chip.high { background: var(--bad-soft); color: var(--bad); }
  .chip.age { background: transparent; color: var(--faint); text-transform: none; letter-spacing: 0; font-weight: 500; font-family: var(--mono); padding: 0; }
  .chip.quiet { background: var(--wait-soft); color: var(--wait); }
  .chip.stopped { background: var(--bad-soft); color: var(--bad); }
  .chip.tool { background: var(--surface-3); color: var(--text); text-transform: none; letter-spacing: 0; }
  .chip.byclaude { background: var(--accent-soft); color: var(--accent); }
  .chip.you { background: var(--you-soft); color: var(--you); }
  .chip.pr { text-transform: none; letter-spacing: 0; background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
  .chip.pr.pass { border-color: rgba(111, 207, 151, 0.45); color: var(--ok); }
  .chip.pr.fail { border-color: rgba(242, 122, 114, 0.45); color: var(--bad); }
  .chip.pr.running { border-color: rgba(231, 183, 95, 0.45); color: var(--wait); }
  .chip.pr.merged { border-color: rgba(142, 168, 255, 0.45); color: var(--accent); }
  .s-active { --c: var(--accent); --cs: var(--accent-soft); }
  .s-done { --c: var(--ok); --cs: var(--ok-soft); }
  .s-waiting { --c: var(--wait); --cs: var(--wait-soft); }
  .s-blocked { --c: var(--bad); --cs: var(--bad-soft); }
  .s-idle, .s-todo { --c: var(--idle); --cs: var(--idle-soft); }
  .chip.state { background: var(--cs); color: var(--c); }
  .dot.state { background: var(--c); }

  /* Overview grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--gap); }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--pad);
    display: flex; flex-direction: column; gap: var(--row); border-left: 3px solid var(--c); position: relative;
  }
  .card.dim { opacity: 0.55; }
  .card.dim:hover { opacity: 1; }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card h3 { margin: 0; font-size: 16px; font-weight: 700; }
  .card h3 button { background: none; border: 0; padding: 0; font-weight: 700; cursor: pointer; text-align: left; }
  .card h3 button:hover { color: var(--accent); }
  .card-streams { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .card-streams li { display: grid; grid-template-columns: 10px 1fr; gap: 8px; align-items: baseline; font-size: var(--fs-sm); }
  .card-streams li .dot { transform: translateY(1px); }
  .card-streams .st-title { font-weight: 600; }
  .card-foot { display: flex; justify-content: space-between; gap: 6px 10px; color: var(--muted); font-size: var(--fs-sm); flex-wrap: wrap; align-items: center; }
  .card-foot .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .pin { background: none; border: 0; color: var(--faint); cursor: pointer; font-size: 12px; font-weight: 600; padding: 2px 4px; border-radius: 5px; }
  .pin[aria-pressed="true"] { color: var(--wait); }
  .pin:hover { color: var(--text); }
  .shipped { font-size: var(--fs-sm); color: var(--muted); }
  .shipped b { color: var(--ok); font-weight: 600; }
  .waiting-on { font-size: var(--fs-sm); color: var(--wait); }

  /* Activity */
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .filters button { font-size: 12px; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 1px 10px; cursor: pointer; }
  .filters button[aria-pressed="true"] { background: var(--accent-soft); border-color: rgba(142, 168, 255, 0.4); color: var(--accent); }
  .feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .feed-day { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); padding: 8px 0 2px; }
  .feed-item { display: grid; grid-template-columns: 9ch auto 1fr; gap: 10px; align-items: baseline; padding-block: 4px; border-top: 1px solid var(--line-soft); font-size: var(--fs-sm); }
  .feed-item time { color: var(--faint); white-space: nowrap; }
  .feed-item.new { background: linear-gradient(90deg, var(--accent-soft), transparent 60%); }

  /* Project view */
  .proj-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px 24px; }
  .proj-head h2 { margin: 0 0 4px; font-size: 24px; font-weight: 700; letter-spacing: -0.015em; text-wrap: balance; }
  .proj-head .meta { color: var(--muted); font-size: var(--fs-sm); display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .stream { display: flex; flex-direction: column; gap: 10px; border-left: 3px solid var(--c); }
  .stream-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; align-items: baseline; }
  .stream-head h3 { margin: 0; font-size: 16px; font-weight: 700; }
  .stream-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--fs-sm); color: var(--muted); align-items: baseline; }
  .current { margin: 0; max-width: 90ch; }
  .callout { display: flex; gap: 10px; align-items: baseline; padding: 6px 12px; border-radius: 8px; background: var(--wait-soft); color: var(--wait); font-size: var(--fs-sm); }
  .callout.bad { background: var(--bad-soft); color: var(--bad); }
  .cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: var(--gap); align-items: start; }
  @media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .step { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; padding-block: var(--row); border-top: 1px solid var(--line-soft); align-items: baseline; }
  .step:first-child { border-top: 0; padding-top: 0; }
  .step .mark { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--c); align-self: center; justify-self: center; }
  .step.s-done .mark { background: var(--c); }
  .step.s-active .mark { background: var(--cs); box-shadow: 0 0 0 3px var(--cs); }
  .step.s-done .step-title { color: var(--muted); }
  .step-note { display: block; color: var(--muted); font-size: var(--fs-sm); }
  .side { display: flex; flex-direction: column; gap: var(--gap); }
  .sub-h { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); margin: 0 0 4px; }
  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .list li { padding-block: 4px; border-top: 1px solid var(--line-soft); font-size: var(--fs-sm); display: flex; justify-content: space-between; gap: 12px; }
  .list li:first-child { border-top: 0; padding-top: 0; }
  .list time { color: var(--faint); white-space: nowrap; }
  .links { display: flex; flex-wrap: wrap; gap: 6px; }
  .links a { font-size: var(--fs-sm); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; background: var(--surface-2); }
  .links a:hover { text-decoration: none; border-color: var(--accent); }

  .notice { color: var(--muted); font-size: var(--fs-sm); border: 1px dashed var(--line); border-radius: var(--radius); padding: var(--pad); }
  .empty { color: var(--muted); font-size: var(--fs-sm); margin: 0; }
  .toast {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-size: var(--fs-sm); color: var(--text); max-width: min(420px, calc(100vw - 32px));
  }
</style>

<header class="top">
  <div class="brand">
    <span class="pulse" id="pulse" aria-hidden="true"></span>
    <h1>Relay Board</h1>
    <span class="crumb" id="crumb" hidden></span>
    <span class="sub" id="sub">Connecting…</span>
    <span class="progress" id="progress" hidden></span>
  </div>
</header>
<section class="usage" id="usage" aria-label="Claude plan usage" hidden></section>
<nav class="tabs" id="tabs" role="tablist" aria-label="Projects"></nav>
<main id="main"></main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
  const STATES = ["active", "waiting", "blocked", "done", "idle", "todo"];
  const STATE_LABEL = { active: "Working", waiting: "Waiting", blocked: "Blocked", done: "Done", idle: "Idle", todo: "To do" };
  const HOUR = 3600e3, DAY = 24 * HOUR, WEEK = 7 * DAY;
  const state = {
    projects: [], streams: [], needs: [], usage: [], archive: [], loaded: {}, fresh: {},
    tab: "overview", live: false, db: null, ready: false,
    open: {}, drafts: {}, feedFilter: "all", feedLimit: 40,
  };

  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return n;
  };
  const st = (s) => (STATES.includes(s) ? s : "idle");
  const safeUrl = (u) => (typeof u === "string" && /^https?:\/\//i.test(u) ? u : null);
  const appUrl = (u) => (typeof u === "string" && /^claude:\/\//i.test(u) ? u : null);
  const link = (label, url) => (safeUrl(url) ? el("a", { href: url, target: "_blank", rel: "noopener" }, label) : el("span", {}, label));
  const ts = (iso) => Date.parse(iso) || 0;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  // Fold/unfold choices (sections, "Show N ..." lists) survive reloads. Drafts and menus don't.
  const OPEN_KEY = "relay-open";
  const PERSIST = /^(sec:|finished-|history-|snoozed-|done-)/;
  try {
    const saved = JSON.parse(store.get(OPEN_KEY) || "{}");
    if (saved && typeof saved === "object") for (const [k, v] of Object.entries(saved)) if (PERSIST.test(k) && typeof v === "boolean") state.open[k] = v;
  } catch {}
  const isOpen = (key, def = false) => (Object.hasOwn(state.open, key) ? !!state.open[key] : def);
  const toggleId = (key) => `tg-${key.replace(/[^\w-]/g, "-")}`;
  function toggleOpen(key, def = false) {
    state.open[key] = !isOpen(key, def);
    const keep = Object.fromEntries(Object.entries(state.open).filter(([k]) => PERSIST.test(k)));
    store.set(OPEN_KEY, JSON.stringify(keep));
    render();
  }
  // A foldable section header: chevron, title, rule and count, all one button.
  function sectionHead(key, id, title, count, def = true) {
    const open = isOpen(key, def);
    const h = el("h2", { class: "eyebrow", id },
      el("button", { type: "button", class: "eyebrow-btn", id: toggleId(key), "aria-expanded": String(open), onclick: () => toggleOpen(key, def) },
        el("span", { class: "chev", "aria-hidden": "true" }, "\u25BE"), title, el("span", { class: "rule" }),
        count != null ? el("span", { class: "mono" }, count) : null));
    return { h, open };
  }

  function ago(iso) {
    const t = ts(iso);
    if (!t) return "";
    const s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return `${Math.floor(s / 60)}m ago`;
    if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
    return `${Math.floor(s / 86400)}d ago`;
  }
  function span(ms) {
    const m = Math.floor(ms / 60000);
    if (m < 60) return `${m}m`;
    const h = Math.floor(m / 60);
    if (h < 48) return `${h}h`;
    return `${Math.floor(h / 24)}d`;
  }
  const timeEl = (iso) => el("time", { datetime: iso || "", class: "mono", title: iso ? new Date(iso).toLocaleString() : "" }, ago(iso));
  const clock = (ms) => new Date(ms).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  const whenLabel = (ms) => {
    const d = new Date(ms);
    const sameDay = new Date().toDateString() === d.toDateString();
    return sameDay ? `today ${clock(ms)}` : `${d.toLocaleDateString(undefined, { weekday: "short" })} ${clock(ms)}`;
  };

  let toastTimer;
  function showToast(msg) {
    const t = $("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 4500);
  }
  async function write(path, data, okMsg) {
    if (!state.db) return false;
    try {
      await state.db.doc(path).update(data);
      if (okMsg) showToast(okMsg);
      return true;
    } catch (e) {
      showToast(e?.code === "invalid_argument" ? "You can view this board but not change it." : "Couldn't save that. Try again in a moment.");
      return false;
    }
  }

  // ---- Model -------------------------------------------------------------
  // A project is a meta doc (projects/<slug>) plus one workstream per chat (streams/<slug>--<topic>).
  // Older agents still write status fields onto the project doc; show those as a "Main" stream.
  const LEGACY_KEYS = ["status", "currentTask", "waitingOn", "steps", "blockers", "links", "recent"];
  function streamsFor(slug) {
    const p = state.projects.find((x) => x.id === slug) || {};
    const list = state.streams.filter((s) => s.project === slug);
    if (p.status) {
      list.push({
        id: `${slug}--legacy`, project: slug, title: "Main", legacy: true,
        agent: p.agent, status: p.status, currentTask: p.currentTask, waitingOn: p.waitingOn,
        steps: p.steps, blockers: p.blockers, links: p.links, recent: p.recent, updatedAt: p.updatedAt,
      });
    }
    return list.sort((a, b) => rankStream(a) - rankStream(b) || ts(b.updatedAt) - ts(a.updatedAt));
  }
  const STATUS_RANK = { blocked: 0, active: 1, waiting: 2, todo: 3, idle: 4, done: 5 };
  const rankStream = (s) => STATUS_RANK[st(s.status)] ?? 4;
  function allProjectSlugs() {
    const slugs = new Set(state.projects.map((p) => p.id));
    for (const s of state.streams) if (s.project) slugs.add(s.project);
    return [...slugs];
  }
  function projectInfo(slug) {
    const meta = state.projects.find((p) => p.id === slug) || { id: slug, name: slug };
    const streams = streamsFor(slug);
    const live = streams.filter((s) => s.status !== "done");
    const status = streams.length ? st([...streams].sort((a, b) => rankStream(a) - rankStream(b))[0].status) : "idle";
    const updatedAt = [...streams.map((s) => s.updatedAt), meta.updatedAt].filter(Boolean).sort().pop();
    const busy = live.some((s) => st(s.status) !== "idle");
    // Finished for now: something got done, nothing is in progress and nothing waits on the user.
    // Idle streams (parked ideas, backlogs) don't count as unfinished work.
    const didWork = streams.some((s) => s.status === "done") || state.archive.some((a) => a.project === slug);
    const complete = !busy && didWork && !state.needs.some((n) => !n.done && n.project === slug);
    const idleWeek = !busy && Date.now() - ts(updatedAt) > WEEK;
    return { ...meta, id: slug, name: meta.name || slug, streams, liveStreams: live, status: complete ? "done" : status, updatedAt, complete, dim: idleWeek && !complete };
  }
  function orderedProjects() {
    return allProjectSlugs().map(projectInfo).sort((a, b) =>
      (b.pinned === true) - (a.pinned === true) || a.dim - b.dim || (a.order ?? 99) - (b.order ?? 99) || ts(b.updatedAt) - ts(a.updatedAt));
  }

  // Quiet detection: a chat that says it's working but hasn't written for a while has likely stopped.
  function quietness(s) {
    const age = Date.now() - ts(s.updatedAt);
    if (!ts(s.updatedAt)) return null;
    if (s.status === "active") {
      if (age > 4 * HOUR) return { cls: "stopped", label: `Silent ${span(age)} · may have stopped` };
      if (age > 90 * 60e3) return { cls: "quiet", label: `Quiet ${span(age)}` };
    }
    if (s.status === "waiting" && !/\b(you|your|user|approval|approve|decide|decision|merge)\b/i.test(s.waitingOn || "") && age > 6 * HOUR) {
      return { cls: "quiet", label: `Still waiting after ${span(age)}` };
    }
    return null;
  }

  // Progress of a project's live work, from the steps agents already write (zero extra agent cost).
  // Each step weighs S=1, M=2 (default), L=4. Steps marked by: "you" and open "Needs you" items for
  // live work are the user's share; an answered item counts as the user's part done.
  const SIZE_WEIGHT = { S: 1, M: 2, L: 4 };
  const LIVE = ["active", "waiting", "blocked"];
  function progressFor(slug) {
    const live = streamsFor(slug).filter((s) => LIVE.includes(s.status));
    if (!live.length) return null;
    const liveIds = new Set(live.map((s) => s.id));
    let total = 0, done = 0, you = 0;
    for (const s of live) {
      for (const x of Array.isArray(s.steps) ? s.steps : []) {
        if (!x || typeof x !== "object") continue;
        const w = SIZE_WEIGHT[String(x.size || "").toUpperCase()] || SIZE_WEIGHT.M;
        total += w;
        if (x.state === "done") done += w;
        else if (x.by === "you") you += w;
      }
    }
    for (const n of state.needs) {
      const sid = n.stream ? String(n.stream).replace(/^streams\//, "") : null;
      if (n.done || n.project !== slug || (sid && !liveIds.has(sid))) continue;
      total += SIZE_WEIGHT.S;
      if (answerState(n)) done += SIZE_WEIGHT.S;
      else you += SIZE_WEIGHT.S;
    }
    if (!total) return null;
    // Round the user's share up and the done share down, so "done" never reads as finished while
    // the user still has something to do.
    const youPct = you ? Math.max(1, Math.ceil((you / total) * 100)) : 0;
    const donePct = Math.min(Math.floor((done / total) * 100), 100 - youPct);
    return { donePct, youPct };
  }
  // Red (0%) through yellow to green (100%).
  const progressColor = (pct) => `hsl(${Math.round(4 + pct * 1.3)} 72% 62%)`;

  // ---- Needs -------------------------------------------------------------
  const isSnoozed = (n) => ts(n.snoozedUntil) > Date.now();
  const answerState = (n) => (n.answer ? n.answerState || "answered" : null);
  const openNeeds = (slug) => state.needs.filter((n) => !n.done && (!slug || n.project === slug));
  const actionable = (slug) => openNeeds(slug).filter((n) => !isSnoozed(n) && !["answered", "relayed"].includes(answerState(n)));
  const projectName = (slug) => state.projects.find((p) => p.id === slug)?.name || slug;
  const KIND_LABEL = { approval: "Approval", decision: "Decision", task: "Manual task" };

  function answerNeed(n, choice) {
    const note = (state.drafts[n.id] || "").trim();
    if (!choice && !note) { showToast("Write an answer first."); return; }
    const patch = {
      answer: { choice: choice || null, note: note || null, at: new Date().toISOString() },
      answerState: "answered",
    };
    if (n.kind === "task" && choice === "Done") Object.assign(patch, { done: true, doneAt: new Date().toISOString(), doneBy: "you" });
    write(`needs/${n.id}`, patch, "Saved. The chat picks it up at the next board check.").then((ok) => {
      if (ok) { delete state.drafts[n.id]; state.open[`reply-${n.id}`] = false; }
    });
  }
  const changeAnswer = (n) => write(`needs/${n.id}`, { answer: null, answerState: null });
  const closeNeed = (n) => write(`needs/${n.id}`, { done: true, doneAt: new Date().toISOString(), doneBy: "you" }, "Marked done.");
  const reopenNeed = (n) => write(`needs/${n.id}`, { done: false, doneAt: null, doneBy: null });
  function snooze(n, until) {
    write(`needs/${n.id}`, { snoozedUntil: until ? new Date(until).toISOString() : null }, until ? `Snoozed until ${whenLabel(until)}.` : "Back in the list.");
    state.open[`snooze-${n.id}`] = false;
  }
  const tomorrowMorning = () => { const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(8, 0, 0, 0); return d.getTime(); };

  function answerControls(n) {
    const box = el("div", { class: "answer" });
    const choices = Array.isArray(n.options) && n.options.length ? n.options
      : n.kind === "approval" ? ["Approve", "Decline"] : n.kind === "task" ? ["Done"] : [];
    const row = el("div", { class: "btn-row" });
    for (const c of choices) {
      const cls = /^(approve|done|yes)\b/i.test(c) ? "btn good" : /^(decline|no|reject)\b/i.test(c) ? "btn danger" : "btn";
      row.append(el("button", { type: "button", class: cls, onclick: () => answerNeed(n, c) }, c));
    }
    const replyKey = `reply-${n.id}`;
    row.append(el("button", { type: "button", class: "btn ghost", "aria-expanded": String(!!state.open[replyKey]), onclick: () => { state.open[replyKey] = !state.open[replyKey]; render(); } },
      choices.length ? "Add a note" : "Reply"));
    const snoozeKey = `snooze-${n.id}`;
    if (state.open[snoozeKey]) {
      row.append(el("span", { class: "snooze-menu" },
        el("button", { type: "button", class: "btn ghost", onclick: () => snooze(n, Date.now() + 3 * HOUR) }, "3 hours"),
        el("button", { type: "button", class: "btn ghost", onclick: () => snooze(n, tomorrowMorning()) }, "Tomorrow 08:00"),
        el("button", { type: "button", class: "btn ghost", onclick: () => snooze(n, Date.now() + WEEK) }, "1 week")));
    } else {
      row.append(el("button", { type: "button", class: "btn ghost", onclick: () => { state.open[snoozeKey] = true; render(); } }, "Snooze"));
    }
    if (n.kind !== "task") row.append(el("button", { type: "button", class: "btn ghost", title: "Close without sending anything to the chat", onclick: () => closeNeed(n) }, "Close"));
    box.append(row);
    if (state.open[replyKey]) {
      const id = `draft-${n.id}`;
      const ta = el("textarea", { id, "aria-label": `Answer for ${n.title}`, placeholder: choices.length ? "Optional note for the chat" : "Your answer. The chat reads this and continues." });
      ta.value = state.drafts[n.id] || "";
      ta.addEventListener("input", (e) => { state.drafts[n.id] = e.target.value; });
      box.append(ta);
      box.append(el("div", { class: "btn-row" },
        el("button", { type: "button", class: "btn primary", onclick: () => answerNeed(n, null) }, choices.length ? "Send note only" : "Send answer"),
        choices.length ? el("span", { class: "dim-text" }, "or pick a button above to send it with your note") : null));
    }
    return box;
  }

  function answeredLine(n) {
    const a = n.answer || {};
    const s = answerState(n);
    const status = s === "handled" ? "Chat handled it" : s === "relayed" ? `Sent to the chat ${ago(n.relayedAt)}` : "Waiting for a chat to pick it up";
    return el("div", { class: "answered" },
      el("span", { class: "you" }, "You answered"),
      a.choice ? el("strong", {}, a.choice) : null,
      a.note ? el("q", {}, a.note) : null,
      el("span", { class: "dim-text" }, `· ${status}`),
      s === "answered" ? el("button", { type: "button", class: "btn ghost", onclick: () => changeAnswer(n) }, "Change") : null);
  }

  function needItem(n, showProject) {
    const li = el("li", { class: `need${n.done ? " done" : ""}` });
    const age = Date.now() - ts(n.createdAt);
    li.append(el("div", { class: "need-head" },
      el("span", { class: "need-title" }, n.title || "Untitled"),
      showProject && n.project ? el("button", { type: "button", class: "chip project", style: "border:0;cursor:pointer", onclick: () => setTab(n.project) }, projectName(n.project)) : null,
      n.kind ? el("span", { class: "chip kind" }, KIND_LABEL[n.kind] || n.kind) : null,
      n.priority === "high" ? el("span", { class: "chip high" }, "High") : null,
      n.done && n.doneBy && n.doneBy !== "you" ? el("span", { class: "chip byclaude" }, "Done by Claude") : null,
      ts(n.createdAt) && !n.done ? el("span", { class: "chip age", title: new Date(ts(n.createdAt)).toLocaleString() }, `waiting ${span(age)}`) : null,
      isSnoozed(n) ? el("span", { class: "chip age" }, `snoozed until ${whenLabel(ts(n.snoozedUntil))}`) : null,
      n.link ? link("Open", n.link) : null));
    if (n.why) li.append(el("div", { class: "need-why" }, n.why));
    if (Array.isArray(n.steps) && n.steps.length) li.append(el("ol", { class: "need-steps" }, n.steps.map((s) => el("li", {}, s))));
    if (n.done) {
      if (n.answer) li.append(answeredLine(n));
      li.append(el("div", { class: "btn-row" }, el("button", { type: "button", class: "btn ghost", onclick: () => reopenNeed(n) }, "Reopen")));
    } else if (isSnoozed(n)) {
      li.append(el("div", { class: "btn-row" }, el("button", { type: "button", class: "btn ghost", onclick: () => snooze(n, null) }, "Unsnooze")));
    } else if (n.answer) {
      li.append(answeredLine(n));
    } else {
      li.append(answerControls(n));
    }
    return li;
  }

  function collapsible(key, label, items, showProject) {
    if (!items.length) return null;
    const wrap = el("div", {});
    const open = isOpen(key);
    wrap.append(el("button", { type: "button", class: "collapser", id: toggleId(key), "aria-expanded": String(open), onclick: () => toggleOpen(key) },
      `${open ? "Hide" : "Show"} ${items.length} ${label}`));
    if (open) wrap.append(el("ul", { class: "needs-list" }, items.map((n) => needItem(n, showProject))));
    return wrap;
  }

  function needsPanel(slug) {
    const items = state.needs.filter((n) => !slug || n.project === slug);
    const byAge = (a, b) => (b.priority === "high") - (a.priority === "high") || ts(a.createdAt) - ts(b.createdAt);
    const open = items.filter((n) => !n.done);
    const act = open.filter((n) => !isSnoozed(n) && !n.answer).sort(byAge);
    const answered = open.filter((n) => !isSnoozed(n) && n.answer).sort((a, b) => ts(b.answer?.at) - ts(a.answer?.at));
    const snoozed = open.filter(isSnoozed).sort((a, b) => ts(a.snoozedUntil) - ts(b.snoozedUntil));
    const done = items.filter((n) => n.done && !isOld(needDoneAt(n))).sort((a, b) => ts(b.doneAt) - ts(a.doneAt));
    const sec = el("section", { "aria-labelledby": `needs-h-${slug || "all"}` });
    const head = sectionHead(`sec:needs:${slug || "all"}`, `needs-h-${slug || "all"}`, "Needs you", `${act.length} open`);
    sec.append(head.h);
    if (!head.open) return sec;
    const panel = el("div", { class: "panel needs" });
    if (!act.length) panel.append(el("p", { class: "empty" }, "Nothing is waiting on you right now."));
    for (const kind of ["approval", "decision", "task"]) {
      const group = act.filter((n) => (n.kind || "task") === kind || (kind === "task" && !["approval", "decision"].includes(n.kind)));
      if (!group.length) continue;
      panel.append(el("div", {},
        el("h3", { class: "n-group-h" }, { approval: "Approvals", decision: "Decisions", task: "Tasks for you" }[kind], el("span", { class: "mono dim-text" }, group.length)),
        el("ul", { class: "needs-list" }, group.map((n) => needItem(n, !slug)))));
    }
    if (answered.length) {
      panel.append(el("div", {},
        el("h3", { class: "n-group-h" }, "Answered, waiting on the chat", el("span", { class: "mono dim-text" }, answered.length)),
        el("ul", { class: "needs-list" }, answered.map((n) => needItem(n, !slug)))));
    }
    const extra = [collapsible(`snoozed-${slug || "all"}`, "snoozed", snoozed, !slug), collapsible(`done-${slug || "all"}`, "done", done, !slug)].filter(Boolean);
    if (extra.length) panel.append(el("div", { class: "btn-row", style: "gap:4px 18px" }, extra));
    sec.append(panel);
    return sec;
  }

  // ---- Since you last looked (computed here, costs no agent tokens) ------
  const SEEN_KEY = "relay-last-seen";
  let lastSeen = Number(store.get(SEEN_KEY)) || 0;
  if (!lastSeen) { lastSeen = Date.now(); store.set(SEEN_KEY, String(lastSeen)); }
  function markSeen() { lastSeen = Date.now(); store.set(SEEN_KEY, String(lastSeen)); render(); }
  let visibleSince = Date.now();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") visibleSince = Date.now();
    else if (Date.now() - visibleSince > 60e3) { lastSeen = Date.now(); store.set(SEEN_KEY, String(lastSeen)); }
  });

  function allActivity() {
    const items = [];
    for (const p of orderedProjects()) {
      for (const s of p.streams) {
        for (const r of Array.isArray(s.recent) ? s.recent : []) {
          if (ts(r.at)) items.push({ ...r, project: p.id, projectName: p.name, stream: s.title });
        }
      }
    }
    return items.sort((a, b) => ts(b.at) - ts(a.at));
  }

  function digest() {
    const since = lastSeen;
    if (Date.now() - since < 10 * 60e3) return null;
    const updates = allActivity().filter((r) => ts(r.at) > since).length;
    const newNeeds = state.needs.filter((n) => !n.done && ts(n.createdAt) > since).length;
    const handled = state.needs.filter((n) => n.done && n.doneBy && n.doneBy !== "you" && ts(n.doneAt) > since).length;

  // ---- History ---------------------------------------------------------------

  // Runs once per page load, after the first snapshots, only when something is over 30 days old.
  let archiving = false;
  async function archiveOld() {
    if (archiving || !state.db || !["streams", "needs", "archive"].every((c) => state.fresh[c])) return;
    const monthOf = (iso) => new Date(ts(iso)).toISOString().slice(0, 7);
    const groups = new Map();
    const add = (slug, iso, key, entry, path) => {
      if (!slug || !/^[\w.-]+$/.test(slug)) return;
      const id = `${slug}--${monthOf(iso)}`;
      if (!groups.has(id)) groups.set(id, { slug, month: monthOf(iso), items: {}, paths: [] });
      const g = groups.get(id); g.items[key] = entry; g.paths.push(path);
    };
    for (const s of state.streams) if (s.status === "done" && isOld(streamDoneAt(s), ARCHIVE_DAYS)) add(s.project, streamDoneAt(s), itemKey("stream", s.id), streamEntry(s), `streams/${s.id}`);
    for (const n of state.needs) if (n.done && isOld(needDoneAt(n), ARCHIVE_DAYS)) add(n.project, needDoneAt(n), itemKey("need", n.id), needEntry(n), `needs/${n.id}`);
    archiving = true;
    if (!groups.size) return;
    try {
      const lock = state.db.doc("archive/_lock");
      const holder = `tab-${Math.random().toString(36).slice(2)}`;
      for (const [id, g] of groups) {
        // Take (or renew) the lease before each month, so a slow run never overlaps another tab.
        if (!(await lock.acquire({ holder, ttlMs: 120000 })).acquired) return;
        const ref = state.db.doc(`archive/${id}`);
        const snap = await ref.get();
        if (snap.exists) await ref.update({ items: g.items, updatedAt: new Date().toISOString() });
        else await ref.set({ project: g.slug, month: g.month, items: g.items, updatedAt: new Date().toISOString() });
        // Delete the full cards only after their summaries are safely stored.

  // ---- Plan usage -------------------------------------------------------
  const RATE_WINDOW = 36 * HOUR;
  const MIN_ELAPSED = 12 * HOUR;
  const num = (v) => (typeof v === "number" && isFinite(v) ? v : null);
  function readings(key) {
    return state.usage
      .map((s) => ({ at: ts(s.at), pct: num(s[key]?.pct), resetsAt: ts(s[key]?.resetsAt) }))
      .filter((r) => r.at && r.pct != null && r.resetsAt)
      .sort((a, b) => a.at - b.at);
  }
  const sameWeek = (a, b) => Math.abs(a - b) < 60e3;
  // Linear interpolation of a week's readings at a given offset from its start.
  function valueAt(week, weekStart, off) {
    const pts = [{ o: 0, p: 0 }, ...week.map((r) => ({ o: r.at - weekStart, p: r.pct }))];
    if (off <= 0) return 0;
    for (let i = 1; i < pts.length; i++) {
      if (pts[i].o >= off) {
        const a = pts[i - 1], b = pts[i];
        return a.p + ((b.p - a.p) * (off - a.o)) / Math.max(1, b.o - a.o);
      }
    }
    return null; // beyond the last reading
  }

  function projectWeek(key) {
    const all = readings(key);
    if (!all.length) return null;
    const latest = all[all.length - 1];
    const now = Date.now();
    const start = latest.resetsAt - WEEK;
    const week = all.filter((r) => sameWeek(r.resetsAt, latest.resetsAt));
    const lastWeek = all.filter((r) => sameWeek(r.resetsAt, latest.resetsAt - WEEK));
    const base = { pct: latest.pct, resetsAt: latest.resetsAt, at: latest.at, start, week, lastWeek, pace: Math.min(100, Math.max(0, ((now - start) / WEEK) * 100)) };
    if (latest.resetsAt <= now) return { ...base, kind: "reset" };
    const daysLeft = (latest.resetsAt - now) / DAY;
    base.perDay = daysLeft > 0.05 ? Math.max(0, 100 - latest.pct) / daysLeft : null;
    const elapsed = latest.at - start;

    // 1) Last week's rhythm: scale the rest of last week's curve by how this week compares so far.
    const lwStart = start - WEEK;
    const lwLast = lastWeek[lastWeek.length - 1];
    if (lastWeek.length >= 4 && lwLast && lwLast.at >= lwStart + WEEK - 12 * HOUR) {
      const lNow = valueAt(lastWeek, lwStart, elapsed);
      if (lNow != null && lNow >= 3 && latest.pct >= 2) {
        const ratio = latest.pct / lNow;
        const lEnd = lwLast.pct;
        const projected = latest.pct + ratio * Math.max(0, lEnd - lNow);
        let runOut = null;
        if (projected > 100) {
          for (let off = elapsed; off <= WEEK; off += HOUR) {
            const v = valueAt(lastWeek, lwStart, off);
            if (v != null && latest.pct + ratio * (v - lNow) >= 100) { runOut = start + off; break; }
          }
        }
        return { ...base, kind: projected > 100 ? "bad" : projected > 90 ? "warn" : "ok", projected, runOut, basis: "last week's rhythm" };
      }
    }
    if (elapsed < MIN_ELAPSED) return { ...base, kind: "early" };
    // 2) Straight line from the trailing ~36h, else the week so far.
    const from = [...week].reverse().find((r) => latest.at - r.at >= RATE_WINDOW);
    const rate = from ? (latest.pct - from.pct) / (latest.at - from.at) : latest.pct / elapsed;
    const projected = latest.pct + Math.max(0, rate) * (latest.resetsAt - latest.at);
    const runOut = rate > 0 && projected > 100 ? latest.at + (100 - latest.pct) / rate : null;
    return { ...base, kind: projected > 100 ? "bad" : projected > 90 ? "warn" : "ok", projected, runOut, basis: from ? "the last 36 hours" : "this week so far" };

  function weekMeter(label, key) {
    const p = projectWeek(key);

    const cls = { ok: "u-ok", warn: "u-warn", bad: "u-bad", early: "u-early", reset: "u-early" }[p.kind];
    const track = el("div", { class: "u-track" },
      el("span", { class: "u-fill", style: `width:${Math.min(100, p.pct)}%` }),
      p.projected != null ? el("span", { class: "u-proj", style: `left:${Math.min(100, p.pct)}%;width:${Math.max(0, Math.min(100, p.projected) - Math.min(100, p.pct))}%` }) : null,
      p.kind !== "reset" ? el("span", { class: "u-pace", style: `left:${p.pace}%`, title: `Even pace: ${Math.round(p.pace)}% by now` }) : null);
    const budget = p.perDay != null ? ` · ~${p.perDay < 10 ? p.perDay.toFixed(1) : Math.round(p.perDay)}%/day left` : "";
    let status;
    if (p.kind === "reset") status = "Week has reset. Waiting for a new reading.";
    else if (p.kind === "early") status = el("span", {}, "Too early to project", el("span", { class: "dim-text" }, `${budget} · resets ${whenLabel(p.resetsAt)}`));
    else if (p.kind === "bad") status = el("span", {}, p.runOut ? `Runs out ~${whenLabel(p.runOut)} at this pace` : "Over budget at this pace", el("span", { class: "dim-text" }, `${budget} · resets ${whenLabel(p.resetsAt)}`));
    else status = el("span", {}, `On track · ~${Math.round(p.projected)}% at reset`, el("span", { class: "dim-text" }, `${budget} · ${whenLabel(p.resetsAt)}`));
    return el("div", { class: `u-meter ${cls}`, title: p.basis ? `Projection based on ${p.basis}` : "" },
      el("div", { class: "u-top" }, el("span", { class: "u-name" }, label), el("span", { class: "u-pct" }, `${p.pct}%`)),
      track,
      el("div", { class: "u-status" }, status));
  }

  // Small week chart: this week, last week (faint), even pace, and the projection.
  function weekChart(label, key) {
    const p = projectWeek(key);
    if (!p) return null;
    const W = 600, H = 132, L = 30, R = 8, T = 8, B = 20;
    const x = (off) => L + (Math.min(WEEK, Math.max(0, off)) / WEEK) * (W - L - R);
    const y = (pct) => T + (1 - Math.min(110, Math.max(0, pct)) / 110) * (H - T - B);
    const NS = "http://www.w3.org/2000/svg";
    const s = (tag, attrs) => { const n = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); return n; };
    const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `${label}: ${p.pct}% used this week` });
    for (const g of [0, 25, 50, 75, 100]) {
      svg.append(s("line", { x1: L, x2: W - R, y1: y(g), y2: y(g), stroke: "var(--line-soft)", "stroke-width": 1 }));
      const t = s("text", { x: L - 6, y: y(g) + 3, "text-anchor": "end", fill: "var(--faint)", "font-size": 9, "font-family": "var(--mono)" }); t.textContent = g; svg.append(t);
    }
    for (let d = 0; d < 7; d++) {
      const t = s("text", { x: x(d * DAY + DAY / 2), y: H - 5, "text-anchor": "middle", fill: "var(--faint)", "font-size": 9 });
      t.textContent = new Date(p.start + d * DAY + DAY / 2).toLocaleDateString(undefined, { weekday: "short" });
      svg.append(t);
      if (d) svg.append(s("line", { x1: x(d * DAY), x2: x(d * DAY), y1: T, y2: H - B, stroke: "var(--line-soft)", "stroke-width": 1 }));
    }
    svg.append(s("line", { x1: x(0), y1: y(0), x2: x(WEEK), y2: y(100), stroke: "var(--muted)", "stroke-width": 1, "stroke-dasharray": "3 4", opacity: 0.6 }));
    const poly = (rows, startMs, attrs) => {
      if (!rows.length) return;
      const pts = [[x(0), y(0)], ...rows.map((r) => [x(r.at - startMs), y(r.pct)])].map((q) => q.join(",")).join(" ");
      svg.append(s("polyline", { points: pts, fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round", ...attrs }));
    };
    poly(p.lastWeek, p.start - WEEK, { stroke: "var(--muted)", "stroke-width": 1.5, opacity: 0.45 });
    const color = { ok: "var(--ok)", warn: "var(--wait)", bad: "var(--bad)" }[p.kind] || "var(--accent)";
    if (p.projected != null && p.kind !== "reset") {
      const endOff = p.runOut ? p.runOut - p.start : WEEK;
      const endPct = p.runOut ? 100 : p.projected;
      svg.append(s("line", { x1: x(p.at - p.start), y1: y(p.pct), x2: x(endOff), y2: y(endPct), stroke: color, "stroke-width": 1.5, "stroke-dasharray": "4 3", opacity: 0.8 }));
    }
    poly(p.week, p.start, { stroke: color, "stroke-width": 2.25 });
    svg.append(s("circle", { cx: x(p.at - p.start), cy: y(p.pct), r: 3.5, fill: color }));
    return el("figure", { class: "u-chart", style: "margin:0" },
      el("div", { class: "u-name", style: "margin-bottom:2px" }, label),
      svg,
      el("figcaption", {},
        el("span", { class: "key", style: `--k:${color}` }, el("i"), "This week"),
        el("span", { class: "key", style: "--k:var(--muted)" }, el("i"), "Last week"),
        el("span", { class: "key", style: "--k:var(--muted)" }, el("i", { class: "dash" }), "Even pace"),
        p.basis ? el("span", {}, `Projection: ${p.basis}`) : null));
  }

  function renderUsage() {
    const box = $("usage");
    const latest = [...state.usage].sort((a, b) => ts(a.at) - ts(b.at)).pop();
    if (!latest) { box.hidden = true; return; }
    box.hidden = false;
    const side = el("div", { class: "u-side" });
    const five = latest.fiveHour;
    if (num(five?.pct) != null && ts(five.resetsAt) > Date.now()) {
      side.append(el("span", { class: `u-pill${five.pct >= 85 ? " hot" : ""}`, title: five.pct >= 85 ? "Close to the 5-hour limit. Hold off on starting big jobs." : "" },
        el("span", { class: "u-name" }, "5-hour"), el("span", { class: "mono" }, `${five.pct}%`),
        el("span", { class: "dim-text" }, five.pct >= 85 ? `near limit · resets ${clock(ts(five.resetsAt))}` : `resets ${clock(ts(five.resetsAt))}`)));
    } else {
      side.append(el("span", { class: "u-pill" }, el("span", { class: "u-name" }, "5-hour"), el("span", { class: "dim-text" }, "window reset")));
    }
    side.append(el("span", {}, "Reading ", timeEl(latest.at), latest.project ? ` · ${latest.project}` : ""));
    const row = el("div", { class: "u-row" }, ...[weekMeter("Weekly · all models", "weekAll"), weekMeter("Weekly · Fable", "weekFable"), side].filter(Boolean));
    const more = el("details", { class: "u-more" });
    if (state.open.usageChart) more.open = true;
    more.addEventListener("toggle", () => { state.open.usageChart = more.open; store.set("relay-usage-chart", more.open ? "1" : "0"); });
    more.append(el("summary", {}, "Week curve"));
    if (more.open) more.append(el("div", { class: "u-charts" }, ...[weekChart("All models", "weekAll"), weekChart("Fable", "weekFable")].filter(Boolean)));
    else more.addEventListener("toggle", () => renderUsage(), { once: true });
    box.replaceChildren(row, more);
  }
  state.open.usageChart = store.get("relay-usage-chart") === "1";

  let pruned = false;
  async function pruneUsage() {
    if (pruned || !state.db) return;
    pruned = true;
    const cutoff = Date.now() - 15 * DAY;
    for (const s of state.usage) {
      if (ts(s.at) && ts(s.at) < cutoff) { try { await state.db.doc(`usage/${s.id}`).delete(); } catch { return; } }
    }
  }

  // ---- Tabs + render ---------------------------------------------------------
  function readTab() {
    const m = location.hash.match(/^#p=([\w.-]+)$/);
    if (m) return m[1];
    return store.get("relay-tab") || "overview";
  }
  function setTab(id) {
    state.tab = id;
    store.set("relay-tab", id);
    history.replaceState(null, "", id === "overview" ? location.pathname + location.search : `#p=${id}`);
    render();
    window.scrollTo({ top: 0 });
  }
  state.tab = readTab();

  function renderTabs(projects) {
    const nav = $("tabs");
    nav.replaceChildren();
    const mk = (id, label, extra) => el("button", { type: "button", role: "tab", "aria-selected": String(state.tab === id), onclick: () => setTab(id) }, extra, label);
    const b = mk("overview", "Overview", null);
    const allOpen = actionable().length;
    if (allOpen) b.append(el("span", { class: "count", title: "Open items that need you" }, allOpen));
    nav.append(b);
    for (const p of projects) {
      const t = mk(p.id, p.name, el("span", { class: `dot state s-${st(p.status)}` }));
      const n = actionable(p.id).length;
      if (n) t.append(el("span", { class: "count" }, n));
      nav.append(t);
    }
  }

  function renderProgress(p) {
    const box = $("progress");
    const pr = !p ? null : p.complete ? { donePct: 100, youPct: 0 } : progressFor(p.id);
    box.hidden = !pr;
    box.classList.toggle("foil", !!p?.complete);
    if (!pr) { box.replaceChildren(); return; }
    box.style.setProperty("--pc", progressColor(pr.donePct));
    box.title = p.complete ? `Everything in ${p.name} is done for now. Nothing is waiting on you.`
      : `${pr.donePct}% of the live work in ${p.name} is done`
        + (pr.youPct ? `. ${pr.youPct}% is waiting on you, so it can reach at most ${100 - pr.youPct}% until you do your part.` : ". Nothing is waiting on you.")
        + " Based on step sizes, not time or tokens.";
    box.replaceChildren(
      el("span", { class: "p-nums" },
        el("span", { class: "p-done" }, `${pr.donePct}%`),
        el("span", { class: "p-sep" }, "/"),
        el("span", { class: "p-total" }, "100%"),
        el("span", { class: "p-sep" }, "−"),
        el("span", { class: `p-you${pr.youPct ? "" : " zero"}` }, `${pr.youPct}%`)),
      el("span", { class: "p-bar", "aria-hidden": "true" },
        el("i", { class: "f-done", style: `width:${pr.donePct}%` }),
        pr.youPct ? el("i", { class: "f-you", style: `width:${pr.youPct}%` }) : null));
  }

  function render() {
    const projects = orderedProjects();
    if (state.tab !== "overview" && !projects.some((p) => p.id === state.tab) && projects.length) state.tab = "overview";
    renderTabs(projects);
    renderUsage();
    const main = $("main");
    const focusId = document.activeElement?.id;
    main.replaceChildren();
    if (!state.db && state.ready) {
      main.append(el("p", { class: "notice" }, "Live data isn't available in this view. Open the board on claude.ai to see your projects."));
      return;
    }
    const p = projects.find((x) => x.id === state.tab);
    // Keep the selected project's name in the sticky header so it stays visible while scrolling
    const crumb = $("crumb");
    crumb.hidden = !p;
    crumb.replaceChildren(...(p ? [
      el("span", { class: "sep", "aria-hidden": "true" }, "›"),
      el("span", { class: `dot state s-${st(p.status)}`, title: STATE_LABEL[st(p.status)] }),
      el("span", { class: "name" }, p.name),
    ] : []));
    renderProgress(p);
    main.append(p ? projectView(p) : overview());
    if (focusId) { const f = document.getElementById(focusId); if (f) { f.focus(); if (f.tagName === "TEXTAREA") f.setSelectionRange(f.value.length, f.value.length); } }
    const latest = [...projects.map((x) => x.updatedAt), ...state.needs.map((x) => x.updatedAt || x.createdAt)].filter(Boolean).sort().pop();
    $("sub").textContent = state.db ? (latest ? `Last update ${ago(latest)}` : "Live") : "Connecting…";
  }

  // Avoid re-rendering under the cursor while someone is typing an answer.
  let pending = false;
  function scheduleRender() {
    if (document.activeElement?.tagName === "TEXTAREA") {
      if (!pending) { pending = true; document.activeElement.addEventListener("blur", () => { pending = false; render(); }, { once: true }); }
      return;
    }
    render();
  }

  window.addEventListener("hashchange", () => { state.tab = readTab(); render(); });
  setInterval(scheduleRender, 60000);
  render();

  (async () => {
    const db = window.claude?.use ? await window.claude.use("db") : null;
    state.ready = true;
    if (!db) { render(); return; }
    state.db = db;
    state.live = true;
    $("pulse").classList.add("live");
    const onErr = () => { $("pulse").classList.remove("live"); $("sub").textContent = "Live updates paused. Reload to reconnect."; };
    const sub = (name, apply) => db.collection(name).onSnapshot((snap) => {
      apply(snap.docs.filter((d) => d.exists).map((d) => ({ id: d.id, ...d.data() })));
      state.loaded[name] = true;
      // Only archive from server-confirmed data, never from a cached snapshot.
      if (!snap.metadata?.fromCache) state.fresh[name] = true;
      scheduleRender();
      archiveOld();
    }, onErr);
    sub("projects", (rows) => { state.projects = rows; });
    sub("streams", (rows) => { state.streams = rows; });
    sub("needs", (rows) => { state.needs = rows; });
    sub("archive", (rows) => { state.archive = rows.filter((r) => r.id !== "_lock"); });
    db.collection("usage").onSnapshot((snap) => {
      state.usage = snap.docs.filter((d) => d.exists).map((d) => ({ id: d.id, ...d.data() }));
      renderUsage();
      pruneUsage();
    }, () => {});
  })();
})();
</script>
