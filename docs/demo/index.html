        sec.append(el("button", { type: "button", class: "collapser", id: toggleId(key), "aria-expanded": String(open), onclick: () => toggleOpen(key) },
          `${open ? "Hide" : "Show"} ${finished.length} finished workstream${finished.length === 1 ? "" : "s"}`));
        if (open) finished.forEach((x) => sec.append(streamPanel(x)));
      }
    }
    frag.append(sec);
    const hist = historyPanel(p);
    if (hist) frag.append(hist);
    return frag;
  }

  // ---- History --------------------------------------------------------
  // What moves to History and what gets archived is decided in the core (historyFor, planArchive).
  function historyPanel(p) {
    const rows = historyFor(state, p.id, Date.now());
    if (!rows.length) return null;
    const sec = el("section", { "aria-labelledby": `hist-h-${p.id}` });
    const head = sectionHead(`history-${p.id}`, `hist-h-${p.id}`, "History", `${rows.length}`, false);
    sec.append(head.h);
    if (!head.open) return sec;
    const panel = el("div", { class: "panel" });
    panel.append(el("p", { class: "empty" }, `Finished items older than ${SHOW_DAYS} days, newest first.`));
    const list = el("ul", { class: "feed" });
    let month = "";
    for (const e of rows) {
      const dated = !!ts(e.finishedAt);
      const d = new Date(ts(e.finishedAt));
      const label = dated ? d.toLocaleDateString(undefined, { month: "long", year: "numeric" }) : "Undated";
      if (label !== month) { month = label; list.append(el("li", { class: "feed-day" }, label)); }
      const title = e.url ? link(e.title, e.url) : el("span", {}, e.title);
      list.append(el("li", { class: "feed-item hist-item" },
        el("time", { class: "mono", datetime: e.finishedAt || "", title: dated ? d.toLocaleString() : "" },
          dated ? d.toLocaleDateString(undefined, { day: "numeric", month: "short" }) : ""),
        el("span", { class: "chip kind" }, e.kind === "need" ? (KIND_LABEL[e.needKind] || "Need") : "Chat"),
        el("span", {}, el("strong", {}, title), e.summary ? el("span", { class: "dim-text" }, ` · ${e.summary}`) : null,
          e.pr?.number ? el("span", { class: "dim-text" }, ` · PR #${e.pr.number}`) : null)));
    }
    panel.append(list);
    sec.append(panel);
    return sec;
  }

  // Runs once per page load, after the first snapshots, only when something is over 30 days old.
  let archiving = false;
  async function archiveOld() {
    if (archiving || !state.db || !["streams", "needs", "archive"].every((c) => state.fresh[c])) return;
    const groups = planArchive(state, Date.now());
    archiving = true; // set even when there's nothing to do: one pass per page load is enough
    if (!groups.length) return;
    try {
      const lock = state.db.doc("archive/_lock");
      const holder = `tab-${Math.random().toString(36).slice(2)}`;
      for (const g of groups) {
        // Take (or renew) the lease before each month, so a slow run never overlaps another tab.
        if (!(await lock.acquire({ holder, ttlMs: ARCHIVE_LEASE_MS })).acquired) return;
        const ref = state.db.doc(`archive/${g.id}`);
        const snap = await ref.get();
        if (snap.exists) await ref.update({ items: g.items, updatedAt: nowIso() });
        else await ref.set({ project: g.slug, month: g.month, items: g.items, updatedAt: nowIso() });
        // Delete the full cards only after their summaries are safely stored, and only cards that
        // are still exactly as planned. A card another chat changed meanwhile (resumed, reopened)
        // stays, and its summary is taken out of History again. The store has no conditional
        // delete, so a write landing between this read and the delete could still be lost; the
        // window is a single round trip, once per page load, for cards untouched for 30 days.
        const unarchived = {};
        for (const c of g.cards) {
          const cur = await state.db.doc(c.path).get();
          if (!cur.exists) continue;
          if (archiveStamp(c.kind, cur.data()) === c.stamp) await state.db.doc(c.path).delete();
          else unarchived[c.key] = null;
        }
        if (Object.keys(unarchived).length) await ref.update({ items: unarchived, updatedAt: nowIso() });
      }
    } catch (e) { console.warn("Relay Board: archiving skipped, will retry on next load", e?.code || e); }
  }

  // ---- Plan usage -----------------------------------------------------
  function weekMeter(label, key) {
    const p = projectWeek(state.usage, key, Date.now());
    if (!p) return null;
    const cls = { ok: "u-ok", warn: "u-warn", bad: "u-bad", early: "u-early", reset: "u-early" }[p.kind];
    const used = Math.min(100, p.pct);
    const track = el("div", { class: "u-track" },
      el("span", { class: "u-fill", style: `width:${used}%` }),
      p.projected != null ? el("span", { class: "u-proj", style: `left:${used}%;width:${Math.max(0, Math.min(100, p.projected) - used)}%` }) : null,
      p.kind !== "reset" ? el("span", { class: "u-pace", style: `left:${p.pace}%`, title: `Even pace: ${Math.round(p.pace)}% by now` }) : null);
    const budget = p.perDay != null ? ` · ~${p.perDay < 10 ? p.perDay.toFixed(1) : Math.round(p.perDay)}%/day left` : "";
    const resets = el("span", { class: "dim-text" }, `${budget} · resets ${whenLabel(p.resetsAt)}`);
    let status;
    if (p.kind === "reset") status = "Week has reset. Waiting for a new reading.";
    else if (p.kind === "early") status = el("span", {}, "Too early to project", resets);
    else if (p.kind === "bad") status = el("span", {}, p.runOut ? `Runs out ~${whenLabel(p.runOut)} at this pace` : "Over budget at this pace", resets);
    else status = el("span", {}, `On track · ~${Math.round(p.projected)}% at reset`, el("span", { class: "dim-text" }, `${budget} · ${whenLabel(p.resetsAt)}`));
    return el("div", { class: `u-meter ${cls}`, title: p.basis ? `Projection based on ${p.basis}` : "" },
      el("div", { class: "u-top" }, el("span", { class: "u-name" }, label), el("span", { class: "u-pct" }, `${p.pct}%`)),
      track,
      el("div", { class: "u-status" }, status));
  }

  // Small week chart: this week, last week (faint), even pace, and the projection.
  function weekChart(label, key) {
    const p = projectWeek(state.usage, key, Date.now());
    if (!p) return null;
    const W = 600, H = 132, L = 30, R = 8, T = 8, B = 20;
    const x = (off) => L + (Math.min(WEEK, Math.max(0, off)) / WEEK) * (W - L - R);
    const y = (pct) => T + (1 - Math.min(110, Math.max(0, pct)) / 110) * (H - T - B);
    const NS = "http://www.w3.org/2000/svg";
    const svgEl = (tag, attrs) => { const n = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); return n; };
    const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `${label}: ${p.pct}% used this week` });
    for (const g of [0, 25, 50, 75, 100]) {
      svg.append(svgEl("line", { x1: L, x2: W - R, y1: y(g), y2: y(g), stroke: "var(--line-soft)", "stroke-width": 1 }));
      const t = svgEl("text", { x: L - 6, y: y(g) + 3, "text-anchor": "end", fill: "var(--faint)", "font-size": 9, "font-family": "var(--mono)" });
      t.textContent = g;
      svg.append(t);
    }
    for (let d = 0; d < 7; d++) {
      const t = svgEl("text", { x: x(d * DAY + DAY / 2), y: H - 5, "text-anchor": "middle", fill: "var(--faint)", "font-size": 9 });
      t.textContent = new Date(p.start + d * DAY + DAY / 2).toLocaleDateString(undefined, { weekday: "short" });
      svg.append(t);
      if (d) svg.append(svgEl("line", { x1: x(d * DAY), x2: x(d * DAY), y1: T, y2: H - B, stroke: "var(--line-soft)", "stroke-width": 1 }));
    }
    svg.append(svgEl("line", { x1: x(0), y1: y(0), x2: x(WEEK), y2: y(100), stroke: "var(--muted)", "stroke-width": 1, "stroke-dasharray": "3 4", opacity: 0.6 }));
    const poly = (rows, startMs, attrs) => {
      if (!rows.length) return;
      const pts = [[x(0), y(0)], ...rows.map((r) => [x(r.at - startMs), y(r.pct)])].map((q) => q.join(",")).join(" ");
      svg.append(svgEl("polyline", { points: pts, fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round", ...attrs }));
    };
    poly(p.lastWeek, p.start - WEEK, { stroke: "var(--muted)", "stroke-width": 1.5, opacity: 0.45 });
    const color = { ok: "var(--ok)", warn: "var(--wait)", bad: "var(--bad)" }[p.kind] || "var(--accent)";
    if (p.projected != null && p.kind !== "reset") {
      const endOff = p.runOut ? p.runOut - p.start : WEEK;
      const endPct = p.runOut ? 100 : p.projected;
      svg.append(svgEl("line", { x1: x(p.at - p.start), y1: y(p.pct), x2: x(endOff), y2: y(endPct), stroke: color, "stroke-width": 1.5, "stroke-dasharray": "4 3", opacity: 0.8 }));
    }
    poly(p.week, p.start, { stroke: color, "stroke-width": 2.25 });
    svg.append(svgEl("circle", { cx: x(p.at - p.start), cy: y(p.pct), r: 3.5, fill: color }));
    return el("figure", { class: "u-chart" },
      el("div", { class: "u-name" }, label),
      svg,
      el("figcaption", {},
        el("span", { class: "key", style: `--k:${color}` }, el("i"), "This week"),
        el("span", { class: "key" }, el("i"), "Last week"),
        el("span", { class: "key" }, el("i", { class: "dash" }), "Even pace"),
        p.basis ? el("span", {}, `Projection: ${p.basis}`) : null));
  }

  function renderUsage() {
    const box = $("usage");
    const latest = [...state.usage].sort((a, b) => ts(a.at) - ts(b.at)).pop();
    if (!latest) { box.hidden = true; return; }
    box.hidden = false;
    const side = el("div", { class: "u-side" });

      side.append(el("span", { class: `u-pill${five.pct >= 85 ? " hot" : ""}`, title: five.pct >= 85 ? "Close to the 5-hour limit. Hold off on starting big jobs." : "" },

    const row = el("div", { class: "u-row" }, ...[weekMeter("Weekly · all models", "weekAll"), weekMeter("Weekly · Fable", "weekFable"), side].filter(Boolean));

  let pruned = false;

  // ---- Services -------------------------------------------------------
  // A second view of the same projects: the third-party services each one uses, and what they cost
  // per month. What counts as a warning, and every sum, comes from servicesSummary() in the core.
  const money = (cost) => formatMoney(cost.monthly, cost.currency);

  const domId = (key) => `svc-${key.replace(/[^\w-]/g, "-")}`;
  const COST_CURRENCIES = ["USD", "EUR", "SEK"];

  function serviceChip(s) {
    const paid = !s.removed && s.cost?.monthly > 0;
    const cls = ["chip svc", paid && "paid", !s.cost && !s.removed && "unset", s.removed && "gone"].filter(Boolean).join(" ");
    const title = s.removed ? "No longer found in the code" : s.cost ? `${money(s.cost)} a month` : "Cost not set";
    return el("span", { class: cls, title }, s.name, paid ? ` ${money(s.cost)}` : null);
  }

  // Set, change or clear the cost the viewer enters by hand (null clears it). The collector's own
  // figure is never touched; whichever of the two is newer counts.
  async function saveCost(slug, s, monthly, currency) {
    const key = `svc:${slug}/${s.id}`, editKey = `cost-${slug}/${s.id}`;
    if (state.saving[key]) return;
    if (monthly != null && !(monthly >= 0 && isFinite(monthly))) {
      state.failed[key] = "Enter an amount of 0 or more.";
      render();
      return;
    }
    const manualCost = monthly == null ? null : { monthly, currency, at: nowIso() };
    const patch = { items: { [s.id]: { manualCost } }, updatedAt: nowIso() };
    if (await guardedSave(key, `services/${slug}`, patch, monthly == null ? "Cost cleared." : "Cost saved.")) {
      delete state.drafts[editKey];
      state.open[editKey] = false;
      render();
    }
  }

  function costEditor(slug, s) {
    const editKey = `cost-${slug}/${s.id}`, id = domId(editKey);
    const draft = (state.drafts[editKey] ||= { amount: s.manualCost ? String(s.manualCost.monthly) : "", currency: s.manualCost?.currency || s.cost?.currency || "USD" });
    const currencies = COST_CURRENCIES.includes(draft.currency) ? COST_CURRENCIES : [...COST_CURRENCIES, draft.currency];
    const amount = el("input", { id, type: "number", min: "0", step: "any", inputmode: "decimal", placeholder: "0", "aria-label": `Monthly cost of ${s.name}`, value: draft.amount });
    amount.addEventListener("input", (e) => { draft.amount = e.target.value; });
    const currency = el("select", { "aria-label": `Currency for ${s.name}` }, currencies.map((c) => el("option", { value: c, selected: c === draft.currency }, c)));
    currency.addEventListener("change", (e) => { draft.currency = e.target.value; });
    const typed = () => (draft.amount.trim() === "" ? NaN : Number(draft.amount.replace(",", ".")));
    const submit = (value) => saveCost(slug, s, value, draft.currency);
    const cancel = () => { delete state.drafts[editKey]; delete state.failed[`svc:${slug}/${s.id}`]; state.open[editKey] = false; render(); };
    amount.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); submit(typed()); }
      else if (e.key === "Escape") cancel();
    });
    return el("div", { class: "cost-edit" }, amount, currency,
      el("button", { type: "button", class: "btn primary", onclick: () => submit(typed()) }, "Save"),
      el("button", { type: "button", class: "btn", title: "Free: save a cost of 0", onclick: () => submit(0) }, "Free"),
      s.manualCost ? el("button", { type: "button", class: "btn ghost", title: "Remove the cost you entered", onclick: () => submit(null) }, "Clear") : null,
      el("button", { type: "button", class: "btn ghost", onclick: cancel }, "Cancel"));
  }

  function renderServiceRow({ slug, s }) {

          !p.warnings.length && !p.unknown ? el("span", { class: "dim-text" }, "–") : null),
        el("td", { "data-label": "Scanned" }, p.scannedAt ? timeEl(p.scannedAt) : el("span", { class: "dim-text" }, "never"))));
      const count = svc.projects.reduce((n, p) => n + p.items.filter((s) => !s.removed).length, 0);
      const foot = el("tr", {},
        el("td", { "data-label": "Total" }, "All projects"),
        el("td", { "data-label": "Services" }, `${count} active`),
        el("td", { class: "num", "data-label": "Per month" }, svc.totals.length ? formatTotals(svc.totals) : "–"),
        el("td", { "data-label": "To check" }, svc.warnings.length ? `${svc.warnings.length} to check` : "–"),
        el("td", { "data-label": "Scanned" }));
      projSec.append(el("div", { class: "panel tbl-wrap" }, el("table", { class: "svc-table" },
        el("thead", {}, el("tr", {}, th("Project"), th("Services"), th("Per month", "num"), th("To check"), th("Scanned"))),
        el("tbody", {}, body), el("tfoot", {}, foot))));
    }
    frag.append(projSec);

    const provSec = el("section", { "aria-labelledby": "svc-prov-h" });
    const provHead = sectionHead("sec:svc-providers", "svc-prov-h", "By provider", `${svc.providers.length}`);
    provSec.append(provHead.h);
    if (provHead.open) {
      const body = svc.providers.map((v) => el("tr", {},
        el("td", { "data-label": "Provider" }, el("strong", {}, v.name), el("span", { class: "dim-text" }, ` · ${SERVICE_CATEGORY_LABEL[v.category]}${v.removed ? " · no longer used" : ""}`)),
        el("td", { "data-label": "Used by" }, el("span", { class: "chips" }, v.projects.map((x) => projectChip(x.slug)))),
        el("td", { class: "num", "data-label": "Per month" }, v.totals.length ? formatTotals(v.totals) : "–")));
      provSec.append(el("div", { class: "panel tbl-wrap" }, el("table", { class: "svc-table" },
        el("thead", {}, el("tr", {}, th("Provider"), th("Used by"), th("Per month", "num"))),
        el("tbody", {}, body))));
    }
    frag.append(provSec);
    return frag;
  }

  // ---- Tabs + render --------------------------------------------------
  // The address says which view (Work or Services) and which project tab is open:
  // (none) / #p=<slug> for Work, #v=services / #v=services&p=<slug> for Services.
  const SERVICES_ROUTE = /^#v=services(?:&p=([\w.-]+))?$/;
  function applyRoute() {
    const services = location.hash.match(SERVICES_ROUTE);
    const work = location.hash.match(/^#p=([\w.-]+)$/);
    if (services) Object.assign(state, { view: "services", tab: services[1] || "overview" });
    else if (work) Object.assign(state, { view: "work", tab: work[1] });
    else Object.assign(state, { view: store.get("relay-view") === "services" ? "services" : "work", tab: store.get("relay-tab") || "overview" });
    store.set("relay-view", state.view);
  }
  function syncHash() {
    const overview = state.tab === "overview";
    const hash = state.view === "services" ? (overview ? "#v=services" : `#v=services&p=${state.tab}`) : overview ? "" : `#p=${state.tab}`;
    history.replaceState(null, "", hash || location.pathname + location.search);
  }
  function setTab(id) {
    state.tab = id;
    store.set("relay-tab", id);
    syncHash();
    render();
    window.scrollTo({ top: 0 });
  }
  function setView(view) {
    if (state.view === view) return;
    state.view = view;
    store.set("relay-view", view);
    syncHash();
    render();
  }
  applyRoute();

  function renderSwitch(svc) {
    const mk = (view, label, count) => el("button", { type: "button", id: `view-${view}`, "aria-pressed": String(state.view === view), onclick: () => setView(view) },
      label, count ? el("span", { class: "count", title: `${count} to check in Services` }, count) : null);
    $("view-switch").replaceChildren(mk("work", "Work"), mk("services", "Services", svc.warnings.length));
  }

  function renderTabs(projects, svc) {
    const nav = $("tabs");
    nav.replaceChildren();
    const selected = projects.some((p) => p.id === state.tab) ? state.tab : "overview";
    // Roving focus: only the selected tab is in the Tab order; arrow keys move between tabs.
    const mk = (id, label, extra) => el("button", {
      type: "button", role: "tab", id: `tab-${id}`, "data-tab": id, "aria-controls": "main",
      "aria-selected": String(selected === id), tabindex: selected === id ? "0" : "-1", onclick: () => setTab(id),
    }, extra, label);
    const b = mk("overview", "Overview", null);
    const services = state.view === "services";
    const badge = (slug) => (services ? (slug ? svc.projects.find((x) => x.slug === slug)?.warnings.length : svc.warnings.length) : actionable(state, slug, Date.now()).length) || 0;
    const badgeTitle = services ? "Services to check" : "Open items that need you";
    const allOpen = badge(null);
    if (allOpen) b.append(el("span", { class: "count", title: badgeTitle }, allOpen));
    nav.append(b);
    for (const p of projects) {
      const t = mk(p.id, p.name, el("span", { class: `dot state s-${st(p.status)}` }));
      if (p.complete) { t.classList.add("foil"); t.title = "All done for now"; }
      const n = badge(p.id);
      if (n) t.append(el("span", { class: "count", title: badgeTitle }, n));
      nav.append(t);
    }
  }

  function renderProgress(p) {
    const box = $("progress");
    const pr = !p ? null : p.complete ? { donePct: 100, youPct: 0 } : progressFor(state, p.id);
    box.hidden = !pr;
    box.classList.toggle("foil", !!p?.complete);
    if (!pr) { box.replaceChildren(); return; }
    box.style.setProperty("--pc", progressColor(pr.donePct));
    box.title = p.complete ? `Everything in ${p.name} is done for now. Nothing is waiting on you.`
      : `${pr.donePct}% of the live work in ${p.name} is done`
        + (pr.youPct ? `. ${pr.youPct}% is waiting on you, so it can reach at most ${100 - pr.youPct}% until you do your part.` : ". Nothing is waiting on you.")
        + " Based on step sizes, not time or tokens.";
    box.replaceChildren(
      el("span", { class: "p-nums" },
        el("span", { class: "p-done" }, `${pr.donePct}%`),
        el("span", { class: "p-sep" }, "/"),
        el("span", { class: "p-total" }, "100%"),
        el("span", { class: "p-sep" }, "−"),
        el("span", { class: `p-you${pr.youPct ? "" : " zero"}` }, `${pr.youPct}%`)),
      el("span", { class: "p-bar", "aria-hidden": "true" },
        el("i", { class: "f-done", style: `width:${pr.donePct}%` }),
        pr.youPct ? el("i", { class: "f-you", style: `width:${pr.youPct}%` }) : null));
  }

  // The header's monthly total in the Services view: for the open project, or all projects on the overview.
  function renderCost(p, svc) {
    const box = $("cost");
    const totals = p ? svc.projects.find((x) => x.slug === p.id)?.totals : svc.totals;
    box.hidden = state.view !== "services" || !totals || !svc.projects.length;
    if (box.hidden) { box.replaceChildren(); return; }
    box.title = `${p ? p.name : "All projects"}: monthly cost of the services, per currency (not converted)`;
    box.replaceChildren(el("span", { class: "p-nums" },
      el("span", { class: "p-done" }, totals.length ? formatTotals(totals) : "No costs set"),
      totals.length ? [" ", el("span", { class: "p-sep" }, "/ month")] : null));
  }

  function render() {
    const projects = orderedProjects(state, Date.now());
    const svc = servicesSummary(state, Date.now());
    // A linked project may simply not have arrived yet; only give up on it once both collections
    // that define projects have loaded.
    if (state.tab !== "overview" && state.loaded.projects && state.loaded.streams && !projects.some((p) => p.id === state.tab)) state.tab = "overview";
    const focusId = document.activeElement?.id;
    renderTabs(projects, svc);
    renderSwitch(svc);
    renderUsage();
    const main = $("main");
    main.replaceChildren();
    if (!state.db && state.ready) {
      main.append(el("p", { class: "notice" }, "Live data isn't available in this view. Open the board on claude.ai to see your projects."));
      return;
    }
    const p = projects.find((x) => x.id === state.tab);
    // Keep the selected project's name in the sticky header so it stays visible while scrolling
    const crumb = $("crumb");
    crumb.hidden = !p;
    crumb.replaceChildren(...(p ? [
      el("span", { class: "sep", "aria-hidden": "true" }, "›"),
      el("span", { class: `dot state s-${st(p.status)}`, title: STATE_LABEL[st(p.status)] }),
      el("span", { class: "name" }, p.name),
    ] : []));
    const services = state.view === "services";
    if (services) $("progress").hidden = true; else renderProgress(p);
    renderCost(p, svc);
    main.setAttribute("aria-labelledby", `tab-${p ? p.id : "overview"}`);
    main.append(services ? (p ? servicesProject(p, svc) : servicesOverview(svc)) : p ? projectView(p) : overview());
    // Re-rendering replaces every node; put focus back where it was.
    const f = focusId && document.getElementById(focusId);
    if (f) {
      f.focus();
      if (f.tagName === "TEXTAREA") f.setSelectionRange(f.value.length, f.value.length);
    }
    // A stamp ahead of now (an agent with a wrong date) must not hide the real last update.
    const latest = [...projects.map((x) => x.updatedAt), ...state.needs.map((x) => x.updatedAt || x.createdAt)]
      .filter((x) => ts(x) && !isFuture(x, Date.now())).sort((a, b) => ts(a) - ts(b)).pop();
    const sub = $("sub");
    sub.classList.toggle("bad", state.paused);
    sub.textContent = state.paused ? "Live updates paused. Reload to reconnect."
      : state.db ? (latest ? `Last update ${ago(latest, Date.now())}` : "Live") : "Connecting…";
  }

  // Avoid re-rendering under the cursor while someone is typing an answer.
  let pending = false;
  function scheduleRender() {
    if (["TEXTAREA", "INPUT", "SELECT"].includes(document.activeElement?.tagName)) {
      if (!pending) { pending = true; document.activeElement.addEventListener("blur", () => { pending = false; render(); }, { once: true }); }
      return;
    }
    render();
  }

  window.addEventListener("hashchange", () => { applyRoute(); render(); });
  // Keyboard: Left/Right move to the previous/next tab and select it, Home/End jump to the ends.
  $("tabs").addEventListener("keydown", (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return; // leave browser shortcuts alone
    const all = [...$("tabs").querySelectorAll('[role="tab"]')];
    const i = all.indexOf(document.activeElement);
    const j = i < 0 ? undefined : { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: all.length - 1 }[e.key];
    if (j === undefined) return;
    e.preventDefault();
    const target = all[(j + all.length) % all.length];
    setTab(target.dataset.tab);
    document.getElementById(target.id)?.focus();
  });
  setInterval(scheduleRender, TICK);
  render();

  // ---- Live data ------------------------------------------------------
  (async () => {
    const db = window.claude?.use ? await window.claude.use("db") : null;
    state.ready = true;
    if (!db) { render(); return; }
    state.db = db;
    $("pulse").classList.add("live");
    // A listener that stops is dead for this page load, so the paused state sticks until a reload.
    const onErr = (e) => {
      console.warn("Relay Board: live updates stopped", e?.code || e);
      state.paused = true;
      $("pulse").classList.remove("live");
      scheduleRender();
    };
    const docs = (name, snap) => snap.docs.filter((d) => d.exists).map((d) => normalize(name, d.id, d.data())).filter(Boolean);
    const sub = (name, apply) => db.collection(name).onSnapshot((snap) => {
      apply(docs(name, snap));
      state.loaded[name] = true;
      // Only archive from server-confirmed data, never from a cached snapshot.
      if (!snap.metadata?.fromCache) state.fresh[name] = true;
      scheduleRender();
      archiveOld();
    }, onErr);
    sub("projects", (rows) => { state.projects = rows; });
    sub("streams", (rows) => { state.streams = rows; });
    sub("needs", (rows) => {
      // A failure note is about the version the viewer tried to change; drop it once that changes.
      const before = new Map(state.needs.map((n) => [n.id, JSON.stringify(n)]));
      for (const n of rows) if (state.failed[n.id] && before.get(n.id) !== JSON.stringify(n)) delete state.failed[n.id];
      state.needs = rows;
    });
    sub("archive", (rows) => { state.archive = rows.filter((r) => r.id !== "_lock"); });
    sub("services", (rows) => { state.services = rows; });
    db.collection("usage").onSnapshot((snap) => {
      state.usage = docs("usage", snap);
      renderUsage();
      pruneUsage();
    }, onErr);
  })();
})();
</script>
