<script>
// URL switches used only to take the README screenshots of the demo; the real board has none.
//   ?open=history,finished  unfolds matching section headers and "Show …" lists
//   ?only=history           hides every section of a project view except its header and History
(() => {
  // The page renders once the fonts stylesheet has loaded and the mock's first snapshots arrive,
  // which can take a while on a slow network. Keep looking for each section until it shows up.
  const RETRY_MS = 100, GIVE_UP_MS = 3000;
  const q = new URLSearchParams(location.search);

  if (q.get("open")) {
    const pending = new Set(q.get("open").split(","));
    const started = Date.now();
    const unfold = () => {
      for (const word of [...pending]) {
        // "Show N finished workstreams" and similar lists
        const re = new RegExp(`^Show .*${word}`, "i");
        const lists = [...document.querySelectorAll(".collapser")].filter((b) => re.test(b.textContent));
        lists.forEach((b) => b.click());
        // Folded section headers, e.g. ?open=history
        const heads = [...document.querySelectorAll(".eyebrow-btn[aria-expanded=false], .digest-toggle[aria-expanded=false]")]
          .filter((b) => b.textContent.replace(/^\W+/, "").toLowerCase().startsWith(word.toLowerCase()));
        heads.forEach((b) => b.click());
        if (lists.length || heads.length) pending.delete(word);
      }
      if (pending.size && Date.now() - started < GIVE_UP_MS) setTimeout(unfold, RETRY_MS);
    };
    setTimeout(unfold, RETRY_MS);
  }

  if (q.get("only") === "history") {
    const css = document.createElement("style");
    css.textContent = 'main > section:not(.proj-head):not([aria-labelledby^="hist-h"]) { display: none !important; }';
    document.head.append(css);
  }
})();
</script>

  .card.foil > * { position: relative; z-index: 2; }
  nav.tabs button.foil { background: var(--ok-soft); color: var(--ok); border-radius: 7px 7px 0 0; box-shadow: inset 0 0 0 1px rgba(111, 207, 151, 0.3); }
  nav.tabs button.foil[aria-selected="true"] { border-bottom-color: var(--ok); }
  .all-done { font-size: var(--fs-sm); font-weight: 600; color: var(--ok); }
  @keyframes foil-sweep { 0%, 100% { background-position: 100% 50%, 0 0; } 50% { background-position: 0% 50%, 0 0; } }
  @media (prefers-reduced-motion: reduce) { .foil::after { animation: none; background-position: 40% 50%, 0 0; } }

  /* Plan usage strip */
  .usage { padding-block: 10px; border-bottom: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 8px; }
  .u-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px 24px; align-items: end; }
  @media (max-width: 720px) { .u-row { grid-template-columns: 1fr; } }
  .u-meter { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .u-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: var(--fs-sm); }
  .u-name { color: var(--muted); }
  .u-pct { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 500; }
  .u-track { position: relative; height: 6px; background: var(--line-soft); border-radius: 999px; }
  .u-fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--c, var(--accent)); }
  .u-proj { position: absolute; top: 0; bottom: 0; border-radius: 0 999px 999px 0; background: var(--c, var(--accent)); opacity: 0.22; }
  .u-pace { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--text); opacity: 0.55; border-radius: 1px; }
  .u-status { font-size: var(--fs-sm); color: var(--c, var(--muted)); min-height: 1.5em; }
  .u-ok { --c: var(--ok); }
  .u-warn { --c: var(--wait); }
  .u-bad { --c: var(--bad); }
  .u-early { --c: var(--accent); }
  .u-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: var(--fs-sm); color: var(--muted); white-space: nowrap; }
  @media (max-width: 720px) { .u-side { align-items: flex-start; flex-direction: row; flex-wrap: wrap; gap: 4px 12px; } }
  .u-pill { display: inline-flex; gap: 8px; align-items: baseline; border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; background: var(--surface); color: var(--text); }
  .u-pill .u-name { font-size: 10px; }
  .u-pill.hot { border-color: rgba(231, 183, 95, 0.5); background: var(--wait-soft); }
  .u-more summary { cursor: pointer; font-size: var(--fs-sm); color: var(--muted); width: max-content; }
  .u-charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; padding-top: 8px; }
  .u-chart { margin: 0; }
  .u-chart .u-name { margin-bottom: 2px; }
  .u-chart svg { width: 100%; height: auto; display: block; }
  .u-chart figcaption { font-size: 11px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 4px; }
  .key { --k: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .key i { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--k); }
  .key i.dash { border-top-style: dashed; }

  nav.tabs { display: flex; gap: 4px; overflow-x: auto; padding-block: 8px 0; scrollbar-width: thin; border-bottom: 1px solid var(--line-soft); }
  nav.tabs button {
    font-size: var(--fs-sm); font-weight: 600; color: var(--muted); background: transparent; border: 0;
    border-bottom: 2px solid transparent; padding: 6px 12px 8px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px;
  }
  nav.tabs button:hover { color: var(--text); }
  nav.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .count { font-family: var(--mono); font-size: 11px; background: var(--wait-soft); color: var(--wait); border-radius: 999px; padding: 1px 7px; }

  main { display: flex; flex-direction: column; gap: calc(var(--gap) * 1.6); padding-top: calc(var(--gap) * 1.4); }

  .eyebrow { color: var(--faint); display: flex; align-items: center; gap: 10px; margin: 0 0 var(--row); }
  .eyebrow .rule { flex: 1; height: 1px; background: var(--line-soft); }
  /* Section headers fold their section; the choice is remembered per browser */
  .eyebrow-btn { all: unset; box-sizing: border-box; flex: 1; display: flex; align-items: center; gap: 10px; cursor: pointer; border-radius: 4px; }
  .eyebrow-btn:hover { color: var(--muted); }
  .eyebrow-btn:hover .rule { background: var(--line); }
  .eyebrow-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .eyebrow .chev { display: inline-block; width: 10px; transition: transform 0.15s ease; }
  .eyebrow-btn[aria-expanded="false"] .chev { transform: rotate(-90deg); }
  @media (prefers-reduced-motion: reduce) { .eyebrow .chev { transition: none; } }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--pad); }

  .btn {
    font-size: var(--fs-sm); font-weight: 600; border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
    border-radius: 7px; padding: 3px 10px; cursor: pointer; min-height: 28px;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.good { background: var(--ok-soft); border-color: rgba(111, 207, 151, 0.4); color: var(--ok); }
  .btn.danger { background: var(--bad-soft); border-color: rgba(242, 122, 114, 0.4); color: var(--bad); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 6px; }
  .btn.ghost:hover { color: var(--text); border-color: var(--line); }
  .btn[disabled] { opacity: 0.5; cursor: default; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  /* Since you last looked */
  .digest { display: flex; flex-direction: column; gap: 10px; border-color: rgba(142, 168, 255, 0.35); background: linear-gradient(90deg, var(--accent-soft), transparent 70%), var(--surface); }
  .digest-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  .digest-toggle { all: unset; box-sizing: border-box; flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; cursor: pointer; border-radius: 6px; }
  .digest-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .digest-toggle .chev { display: inline-block; width: 10px; color: var(--muted); font-size: 11px; transition: transform 0.15s ease; }
  .digest-toggle[aria-expanded="false"] .chev { transform: rotate(-90deg); }
  @media (prefers-reduced-motion: reduce) { .digest-toggle .chev { transition: none; } }
  .digest strong { font-weight: 600; }
  .digest .facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--fs-sm); color: var(--muted); }
  .digest .facts b { color: var(--text); font-weight: 600; font-family: var(--mono); }
  .digest .fact.you b { color: var(--you); }
  .digest .fact.fin b { color: var(--ok); }
  .digest .fact.quiet b { color: var(--wait); }
  .digest-toggle:hover .facts { color: var(--text); }
  .digest-body { display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--line-soft); padding-top: 10px; }
  .d-list, .d-sub { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .d-list > li, .d-sub > li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding-block: 4px; border-top: 1px solid var(--line-soft); font-size: var(--fs-sm); }
  .d-list > li:first-child { border-top: 0; }
  .d-list time, .d-sub time { min-width: 9ch; white-space: nowrap; }
  .d-list > li.d-proj { flex-direction: column; align-items: stretch; gap: 2px; }
  .d-proj-head { display: flex; align-items: baseline; gap: 10px; }
  .d-sub { padding-left: 14px; }
  .d-sub > li:first-child { border-top: 0; }
  .d-list .fin .spark { color: var(--ok); }
  .d-list .chip.high { margin-left: 6px; }

  /* Needs you */
  .needs { border-color: rgba(231, 183, 95, 0.35); background: linear-gradient(180deg, rgba(231,183,95,0.06), transparent 120px), var(--surface); display: flex; flex-direction: column; gap: 10px; }
  .n-group-h { color: var(--muted); margin: 0; display: flex; gap: 8px; align-items: center; }
  .needs-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .need { display: flex; flex-direction: column; gap: 4px; padding-block: 8px; border-top: 1px solid var(--line-soft); }
  .needs-list > .need:first-child { border-top: 0; padding-top: 2px; }
  .need-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .need-title { font-weight: 600; }
  .need.done .need-title { color: var(--muted); text-decoration: line-through; }
  .need-why { color: var(--muted); font-size: var(--fs-sm); max-width: 90ch; }
  .need-steps { margin: 2px 0 0; padding-left: 18px; font-size: var(--fs-sm); max-width: 90ch; }
  .need-steps li + li { margin-top: 2px; }
  .answer { display: flex; flex-direction: column; gap: 6px; margin-top: 2px; }
  .answer textarea {
    font: inherit; font-size: var(--fs-sm); color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 8px; min-height: 52px; resize: vertical; width: 100%; max-width: 90ch;
  }
  .answered { font-size: var(--fs-sm); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .answered .you { color: var(--ok); font-weight: 600; }
  .answered q { color: var(--text); }
  .answered .stuck { color: var(--wait); }
  time.future, .feed-item time.future, .list time.future { color: var(--bad); }
  .needs-extra { gap: 4px 18px; }
  .snooze-menu { display: inline-flex; gap: 4px; }
  .collapser { background: none; border: 0; color: var(--muted); font-size: var(--fs-sm); cursor: pointer; padding: 2px 0; text-align: left; }
  .collapser:hover { color: var(--text); }

  .chip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
    text-transform: uppercase; border-radius: 999px; padding: 1px 8px; white-space: nowrap;
  }
  .chip.project { background: var(--accent-soft); color: var(--accent); text-transform: none; letter-spacing: 0; font-size: 12px; }
  button.chip.project { border: 0; cursor: pointer; }
  .chip.kind { background: var(--surface-2); color: var(--muted); }
  .chip.high { background: var(--bad-soft); color: var(--bad); }
  .chip.age { background: transparent; color: var(--faint); text-transform: none; letter-spacing: 0; font-weight: 500; font-family: var(--mono); padding: 0; }
  .chip.quiet { background: var(--wait-soft); color: var(--wait); }
  .chip.stopped { background: var(--bad-soft); color: var(--bad); }
  .chip.tool { background: var(--surface-3); color: var(--text); text-transform: none; letter-spacing: 0; }
  .chip.byclaude { background: var(--accent-soft); color: var(--accent); }
  .chip.you { background: var(--you-soft); color: var(--you); }
  .chip.pr { text-transform: none; letter-spacing: 0; background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
  .chip.pr.pass { border-color: rgba(111, 207, 151, 0.45); color: var(--ok); }
  .chip.pr.fail { border-color: rgba(242, 122, 114, 0.45); color: var(--bad); }
  .chip.pr.running { border-color: rgba(231, 183, 95, 0.45); color: var(--wait); }
  .chip.pr.merged { border-color: rgba(142, 168, 255, 0.45); color: var(--accent); }
  .pr-link, .pr-link:hover { text-decoration: none; }
  .s-active { --c: var(--accent); --cs: var(--accent-soft); }
  .s-done { --c: var(--ok); --cs: var(--ok-soft); }
  .s-waiting { --c: var(--wait); --cs: var(--wait-soft); }
  .s-blocked { --c: var(--bad); --cs: var(--bad-soft); }
  .s-idle, .s-todo { --c: var(--idle); --cs: var(--idle-soft); }
  .chip.state { background: var(--cs); color: var(--c); }
  .dot.state { background: var(--c); }

  /* Overview grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--gap); }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--pad);
    display: flex; flex-direction: column; gap: var(--row); border-left: 3px solid var(--c); position: relative;
  }
  .card.dim { opacity: 0.55; }
  .card.dim:hover { opacity: 1; }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card h3 { margin: 0; font-size: 16px; font-weight: 700; }
  .card h3 button { background: none; border: 0; padding: 0; font-weight: 700; cursor: pointer; text-align: left; }
  .card h3 button:hover { color: var(--accent); }
  .card-streams { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .card-streams li { display: grid; grid-template-columns: 10px 1fr; gap: 8px; align-items: baseline; font-size: var(--fs-sm); }
  .card-streams li .dot { transform: translateY(1px); }
  .card-streams .st-title { font-weight: 600; }
  .card-foot { display: flex; justify-content: space-between; gap: 6px 10px; color: var(--muted); font-size: var(--fs-sm); flex-wrap: wrap; align-items: center; }
  .card-foot .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .pin { background: none; border: 0; color: var(--faint); cursor: pointer; font-size: 12px; font-weight: 600; padding: 2px 4px; border-radius: 5px; }
  .pin[aria-pressed="true"] { color: var(--wait); }
  .pin:hover { color: var(--text); }
  .shipped { font-size: var(--fs-sm); color: var(--muted); }
  .shipped b { color: var(--ok); font-weight: 600; }

  /* Activity */
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .filters button { font-size: 12px; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 1px 10px; cursor: pointer; }
  .filters button[aria-pressed="true"] { background: var(--accent-soft); border-color: rgba(142, 168, 255, 0.4); color: var(--accent); }
  .feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .feed-day { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); padding: 8px 0 2px; }
  .feed-item { display: grid; grid-template-columns: 9ch auto 1fr; gap: 10px; align-items: baseline; padding-block: 4px; border-top: 1px solid var(--line-soft); font-size: var(--fs-sm); }
  .feed-item time { color: var(--faint); white-space: nowrap; }
  .feed-item.new { background: linear-gradient(90deg, var(--accent-soft), transparent 60%); }

  /* Project view */
  .proj-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px 24px; }
  .proj-head h2 { margin: 0 0 4px; font-size: 24px; font-weight: 700; letter-spacing: -0.015em; text-wrap: balance; }
  .proj-head .meta { color: var(--muted); font-size: var(--fs-sm); display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .workstreams { display: flex; flex-direction: column; gap: var(--gap); }
  .stream { display: flex; flex-direction: column; gap: 10px; border-left: 3px solid var(--c); }
  .stream-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; align-items: baseline; }
  .stream-head h3 { margin: 0; font-size: 16px; font-weight: 700; min-width: 0; }
  .stream-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--fs-sm); color: var(--muted); align-items: baseline; }
  .stream-toggle { all: unset; box-sizing: border-box; display: inline-flex; align-items: baseline; gap: 8px; cursor: pointer; border-radius: 6px; }
  .stream-toggle:hover { color: var(--accent); }
  .stream-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .stream-toggle .chev { display: inline-block; width: 10px; color: var(--muted); font-size: 11px; transition: transform 0.15s ease; }
  .stream-toggle[aria-expanded="false"] .chev { transform: rotate(-90deg); }
  @media (prefers-reduced-motion: reduce) { .stream-toggle .chev { transition: none; } }
  .stream-sum { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: baseline; font-size: var(--fs-sm); color: var(--muted); }
  .stream-body { display: flex; flex-direction: column; gap: 10px; }
  .current { margin: 0; max-width: 90ch; }
  .callout { display: flex; gap: 10px; align-items: baseline; padding: 6px 12px; border-radius: 8px; background: var(--wait-soft); color: var(--wait); font-size: var(--fs-sm); }
  .callout.bad { background: var(--bad-soft); color: var(--bad); }
  .cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: var(--gap); align-items: start; }
  @media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .step { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; padding-block: var(--row); border-top: 1px solid var(--line-soft); align-items: baseline; }
  .step:first-child { border-top: 0; padding-top: 0; }
  .step .mark { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--c); align-self: center; justify-self: center; }
  .step.s-done .mark { background: var(--c); }
  .step.s-active .mark { background: var(--cs); box-shadow: 0 0 0 3px var(--cs); }
  .step.s-done .step-title { color: var(--muted); }
  .step-note { display: block; color: var(--muted); font-size: var(--fs-sm); }
  .side { display: flex; flex-direction: column; gap: var(--gap); }
  .sub-h { color: var(--faint); margin: 0 0 4px; }
  .blockers { display: flex; flex-direction: column; gap: 6px; }
  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .list li { padding-block: 4px; border-top: 1px solid var(--line-soft); font-size: var(--fs-sm); display: flex; justify-content: space-between; gap: 12px; }
  .list li:first-child { border-top: 0; padding-top: 0; }
  .list time { color: var(--faint); white-space: nowrap; }
  .links { display: flex; flex-wrap: wrap; gap: 6px; }
  .links a { font-size: var(--fs-sm); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; background: var(--surface-2); }
  .links a:hover { text-decoration: none; border-color: var(--accent); }

  /* Work | Services switch */
  .view-switch { display: inline-flex; align-self: center; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
  .view-switch button { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; padding: 2px 12px; background: transparent; color: var(--muted); font-size: var(--fs-sm); font-weight: 600; cursor: pointer; }
  .view-switch button:hover { color: var(--text); }
  .view-switch button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

  /* Services */
  .chips { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
  .chip.svc { background: var(--surface-2); color: var(--muted); text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 12px; }
  .chip.svc.paid { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .chip.svc.unset { background: transparent; border: 1px dashed var(--line); }
  .chip.svc.gone { text-decoration: line-through; }
  .tbl-wrap { overflow-x: auto; }
  table.svc-table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
  .svc-table th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); padding: 4px 10px 6px; border-bottom: 1px solid var(--line); }
  .svc-table td { padding: 8px 10px; border-top: 1px solid var(--line-soft); vertical-align: top; }
  .svc-table tbody tr:first-child td { border-top: 0; }
  .svc-table .num { text-align: right; white-space: nowrap; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .svc-table tfoot td { border-top: 1px solid var(--line); font-weight: 600; }
  .svc-table .name-btn { background: none; border: 0; padding: 0; font-weight: 700; cursor: pointer; text-align: left; }
  .svc-table .name-btn:hover { color: var(--accent); }
  @media (max-width: 640px) {
    .svc-table thead { display: none; }
    .svc-table, .svc-table tbody, .svc-table tfoot, .svc-table tr, .svc-table td { display: block; }
    .svc-table tr { padding-block: 8px; border-top: 1px solid var(--line-soft); }
    .svc-table tbody tr:first-child { border-top: 0; }
    .svc-table td, .svc-table tfoot td { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border: 0; padding: 2px 0; }
    .svc-table td::before { content: attr(data-label); flex: none; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
    .svc-table td:first-child::before { content: none; }
    .svc-table .num { text-align: right; }
  }
  .svc-groups { display: flex; flex-direction: column; gap: 12px; }
  .svc-group { display: flex; flex-direction: column; gap: 4px; }

<header class="top">
  <div class="brand">
    <span class="pulse" id="pulse" aria-hidden="true"></span>
    <h1>Relay Board</h1>
    <span class="crumb" id="crumb" hidden></span>
    <div class="view-switch" id="view-switch" role="group" aria-label="View"></div>
    <span class="sub" id="sub">Connecting…</span>
    <span class="progress" id="progress" hidden></span>
    <span class="progress" id="cost" hidden></span>
  </div>
</header>
<section class="usage" id="usage" aria-label="Claude plan usage" hidden></section>
<nav class="tabs" id="tabs" role="tablist" aria-label="Projects"></nav>
<main id="main" role="tabpanel"></main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
// ---- Core: pure logic, no DOM ----
// Agents only write plain facts to the board (status, steps, needs, usage readings). Everything
// derived from them (progress, quiet chats, the digest, usage projections, archiving) is computed
// here in the page, so none of it costs agent tokens.
// This first script is that logic, kept pure: no DOM, storage or clock. Functions take the board
// data explicitly (`data` = { projects, streams, needs, archive }) and, where time matters, `now`
// in ms, so the unit tests in test/ can run it in Node. The second script below is the UI.
globalThis.RelayCore = (() => {
  // ---- Tuning ---------------------------------------------------------
  const MINUTE = 60e3, HOUR = 60 * MINUTE, DAY = 24 * HOUR, WEEK = 7 * DAY;
  const TICK = MINUTE;                      // re-render so relative times stay current
  const QUIET_AFTER = 90 * MINUTE;          // a working chat this silent is flagged "quiet"
  const STOPPED_AFTER = 4 * HOUR;           // ...and this silent, "may have stopped"
  const WAITING_QUIET_AFTER = 6 * HOUR;     // a chat waiting on something other than the user
  const DIGEST_MIN_AGE = 10 * MINUTE;       // don't show "Since you last looked" for short absences
  const FEED_PAGE = 40;                     // activity rows per "Show more"
  const SHOW_DAYS = 7, ARCHIVE_DAYS = 30;   // done items: in view, then History, then archived
  const ARCHIVE_LEASE_MS = 2 * MINUTE;      // lock lease so two tabs never archive at once
  const USAGE_KEEP_DAYS = 15;               // plan-usage readings older than this are deleted
  const RATE_WINDOW = 36 * HOUR;            // usage projection: trailing window for the rate
  const MIN_ELAPSED = 12 * HOUR;            // usage projection: too early before this
  const STUCK_AFTER = 2 * HOUR;             // an answer a chat claimed but never handled
  const CLOCK_SKEW = 10 * MINUTE;           // times further ahead than this are wrong, not early
  const COST_STALE_AFTER = 45 * DAY;        // a service cost nobody has confirmed for this long is "stale"
  const COST_INCREASE_RATIO = 1.25;         // a bill up by more than 25%...
  const COST_INCREASE_MIN = 5;              // ...and by at least this much is flagged

  const STATES = ["active", "waiting", "blocked", "done", "idle", "todo"];
  const STATE_LABEL = { active: "Working", waiting: "Waiting", blocked: "Blocked", done: "Done", idle: "Idle", todo: "To do" };

  // ---- Basics ---------------------------------------------------------
  const st = (s) => (STATES.includes(s) ? s : "idle");
  const safeUrl = (u) => (typeof u === "string" && /^https?:\/\//i.test(u) ? u : null);
  const appUrl = (u) => (typeof u === "string" && /^claude:\/\//i.test(u) ? u : null);
  const ts = (iso) => Date.parse(iso) || 0;
  const num = (v) => (typeof v === "number" && isFinite(v) ? v : null);
  const clip = (v, n = 300) => (typeof v === "string" ? v.slice(0, n) : null);
  // One collection of the board data, always as an array.
  const rows = (data, name) => (data && Array.isArray(data[name]) ? data[name] : []);
  const isObj = (v) => v !== null && typeof v === "object" && !Array.isArray(v);

  // ---- Incoming docs --------------------------------------------------
  // Docs are written by many agents and tabs. Clean each one on the way in so a single malformed
  // doc can't break the page: lists keep only well-formed entries, and the store's doc id always
  // wins over an `id` field inside the data. Returns null for a doc that isn't an object at all.
  const objects = (v) => (Array.isArray(v) ? v.filter(isObj) : []);
  const texts = (v) => (Array.isArray(v) ? v.filter((x) => typeof x === "string" || typeof x === "number").map(String) : []);
  const validCost = (c) => isObj(c) && num(c.monthly) != null && c.monthly >= 0 && typeof c.currency === "string" && c.currency.trim() !== "";
  function normalize(name, id, raw) {
    if (!isObj(raw)) return null;
    const d = { ...raw, id };
    if (name === "streams" || name === "projects") {
      for (const k of ["steps", "blockers", "links", "recent"]) if (k in d) d[k] = objects(d[k]);
    }
    if (name === "needs") {
      for (const k of ["steps", "options"]) if (k in d) d[k] = texts(d[k]);
      // A bare string or number is read as the choice; anything else that isn't an object means no answer.
      if (!isObj(d.answer)) d.answer = (typeof d.answer === "string" && d.answer.trim()) || typeof d.answer === "number" ? { choice: String(d.answer) } : null;
    }
    if (name === "services") {
      // `items` is a map of provider id -> item. Keep only objects, text lists, and cost objects
      // that have a usable amount and currency.
      const items = {};
      for (const [key, item] of Object.entries(isObj(d.items) ? d.items : {})) {
        if (!isObj(item)) continue;
        const clean = { ...item };
        for (const k of ["envVars", "evidence"]) if (k in clean) clean[k] = texts(clean[k]);
        for (const k of ["autoCost", "manualCost"]) if (k in clean && !validCost(clean[k])) delete clean[k];
        items[key] = clean;
      }
      d.items = items;
    }
    return d;
  }

  // A time well ahead of now means the agent that wrote it guessed the date or has a wrong clock.
  const isFuture = (iso, now) => ts(iso) > now + CLOCK_SKEW;
  function ago(iso, now) {
    const t = ts(iso);
    if (!t) return "";
    if (isFuture(iso, now)) return "in the future";
    const s = Math.max(0, (now - t) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return `${Math.floor(s / 60)}m ago`;
    if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
    return `${Math.floor(s / 86400)}d ago`;
  }
  function span(ms) {
    const m = Math.floor(ms / MINUTE);
    if (m < 60) return `${m}m`;
    const h = Math.floor(m / 60);
    if (h < 48) return `${h}h`;
    return `${Math.floor(h / 24)}d`;
  }

  // ---- Model ----------------------------------------------------------
  // A project is a meta doc (projects/<slug>) plus one workstream per chat (streams/<slug>--<topic>).
  // Older agents still write status fields onto the project doc; show those as a "Main" stream.
  const STATUS_RANK = { blocked: 0, active: 1, waiting: 2, todo: 3, idle: 4, done: 5 };
  const rankStream = (s) => STATUS_RANK[st(s.status)] ?? 4;
  function streamsFor(data, slug) {
    const p = rows(data, "projects").find((x) => x.id === slug) || {};
    const list = rows(data, "streams").filter((s) => s.project === slug);
    if (p.status) {
      list.push({
        id: `${slug}--legacy`, project: slug, title: "Main", legacy: true,
        agent: p.agent, status: p.status, currentTask: p.currentTask, waitingOn: p.waitingOn,
        steps: p.steps, blockers: p.blockers, links: p.links, recent: p.recent, updatedAt: p.updatedAt,
      });
    }
    return list.sort((a, b) => rankStream(a) - rankStream(b) || ts(b.updatedAt) - ts(a.updatedAt));
  }
  function allProjectSlugs(data) {
    const slugs = new Set(rows(data, "projects").map((p) => p.id));
    for (const s of rows(data, "streams")) if (s.project) slugs.add(s.project);
    return [...slugs];
  }
  function projectInfo(data, slug, now) {
    const meta = rows(data, "projects").find((p) => p.id === slug) || { id: slug, name: slug };
    const streams = streamsFor(data, slug);
    const live = streams.filter((s) => s.status !== "done");
    const status = streams.length ? st([...streams].sort((a, b) => rankStream(a) - rankStream(b))[0].status) : "idle";
    const updatedAt = [...streams.map((s) => s.updatedAt), meta.updatedAt].filter(Boolean).sort().pop();
    const busy = live.some((s) => st(s.status) !== "idle");
    // Finished for now: something got done, nothing is in progress and nothing waits on the user.
    // Idle streams (parked ideas, backlogs) don't count as unfinished work.
    const didWork = streams.some((s) => s.status === "done") || rows(data, "archive").some((a) => a.project === slug);
    const complete = !busy && didWork && !rows(data, "needs").some((n) => !n.done && n.project === slug);
    const idleWeek = !busy && now - ts(updatedAt) > WEEK;
    return { ...meta, id: slug, name: meta.name || slug, streams, liveStreams: live, status: complete ? "done" : status, updatedAt, complete, dim: idleWeek && !complete };
  }
  function orderedProjects(data, now) {
    return allProjectSlugs(data).map((slug) => projectInfo(data, slug, now)).sort((a, b) =>
      (b.pinned === true) - (a.pinned === true) || a.dim - b.dim || (a.order ?? 99) - (b.order ?? 99) || ts(b.updatedAt) - ts(a.updatedAt));
  }

  // Quiet detection: a chat that says it's working but hasn't written for a while has likely stopped.
  const WAITS_ON_USER = /\b(you|your|user|approval|approve|decide|decision|merge)\b/i;
  function quietness(s, now) {
    if (!ts(s.updatedAt)) return null;
    const age = now - ts(s.updatedAt);
    if (s.status === "active") {
      if (age > STOPPED_AFTER) return { cls: "stopped", label: `Silent ${span(age)} · may have stopped` };
      if (age > QUIET_AFTER) return { cls: "quiet", label: `Quiet ${span(age)}` };
    }
    if (s.status === "waiting" && !WAITS_ON_USER.test(s.waitingOn || "") && age > WAITING_QUIET_AFTER) {
      return { cls: "quiet", label: `Still waiting after ${span(age)}` };
    }
    return null;
  }

  // What a collapsed workstream shows: step counts and blockers. Malformed steps and blockers are ignored.
  function streamCounts(s) {
    const steps = (Array.isArray(s?.steps) ? s.steps : []).filter((x) => x && typeof x === "object");
    const blockers = (Array.isArray(s?.blockers) ? s.blockers : []).filter((x) => x && typeof x === "object");
    const done = steps.filter((x) => x.state === "done").length;
    return {
      done, left: steps.length - done, total: steps.length,
      you: steps.filter((x) => x.by === "you" && x.state !== "done").length,
      blockers: blockers.length, highBlockers: blockers.filter((x) => x.severity === "high").length,
    };
  }

  // ---- Needs ----------------------------------------------------------
  const isSnoozed = (n, now) => ts(n.snoozedUntil) > now;
  const answerState = (n) => (n.answer ? n.answerState || "answered" : null);
  // Open items count toward "not finished"; actionable ones are what the count badges show.
  const openNeeds = (data, slug) => rows(data, "needs").filter((n) => !n.done && (!slug || n.project === slug));
  // Items still waiting on the user: open, not snoozed and not answered (whatever the answer's relay state).
  const actionable = (data, slug, now) => openNeeds(data, slug).filter((n) => !isSnoozed(n, now) && !answerState(n));
  // A chat claimed the answer ("relayed") but hasn't confirmed it for a while: it may have stopped
  // before passing it on. The page then offers to send it again.
  // Without any valid timestamp there is no way to tell, so it is not flagged.
  function relayStuck(n, now) {
    const since = ts(n.relayedAt) || ts(n.answer?.at);
    return !n.done && answerState(n) === "relayed" && since > 0 && now - since > STUCK_AFTER;
  }
  // The groups of the "Needs you" panel, for one project or (slug null) all of them.
  function needsGroups(data, slug, now) {
    const items = rows(data, "needs").filter((n) => !slug || n.project === slug);
    const byAge = (a, b) => (b.priority === "high") - (a.priority === "high") || ts(a.createdAt) - ts(b.createdAt);
    const open = items.filter((n) => !n.done);
    return {
      act: open.filter((n) => !isSnoozed(n, now) && !n.answer).sort(byAge),
      answered: open.filter((n) => !isSnoozed(n, now) && n.answer).sort((a, b) => ts(b.answer?.at) - ts(a.answer?.at)),
      snoozed: open.filter((n) => isSnoozed(n, now)).sort((a, b) => ts(a.snoozedUntil) - ts(b.snoozedUntil)),
      done: items.filter((n) => n.done && !isOld(needDoneAt(n), now)).sort((a, b) => ts(b.doneAt) - ts(a.doneAt)),
    };
  }

  // ---- Progress -------------------------------------------------------
  // Progress of a project's live work, from the steps agents already write.
  // Each step weighs S=1, M=2 (default), L=4. Steps marked by: "you" and open "Needs you" items for
  // live work are the user's share; an answered item counts as the user's part done.
  const SIZE_WEIGHT = { S: 1, M: 2, L: 4 };
  const LIVE = ["active", "waiting", "blocked"];
  function progressFor(data, slug) {
    const live = streamsFor(data, slug).filter((s) => LIVE.includes(s.status));
    if (!live.length) return null;
    const liveIds = new Set(live.map((s) => s.id));
    let total = 0, done = 0, you = 0;
    for (const s of live) {
      for (const x of Array.isArray(s.steps) ? s.steps : []) {
        if (!x || typeof x !== "object") continue;
        const w = SIZE_WEIGHT[String(x.size || "").toUpperCase()] || SIZE_WEIGHT.M;
        total += w;
        if (x.state === "done") done += w;
        else if (x.by === "you") you += w;
      }
    }
    for (const n of rows(data, "needs")) {
      const sid = n.stream ? String(n.stream).replace(/^streams\//, "") : null;
      if (n.done || n.project !== slug || (sid && !liveIds.has(sid))) continue;
      total += SIZE_WEIGHT.S;
      if (answerState(n)) done += SIZE_WEIGHT.S;
      else you += SIZE_WEIGHT.S;
    }
    if (!total) return null;
    // Round the user's share up and the done share down, so "done" never reads as finished while
    // the user still has something to do.
    const youPct = you ? Math.max(1, Math.ceil((you / total) * 100)) : 0;
    const donePct = Math.min(Math.floor((done / total) * 100), 100 - youPct);
    return { donePct, youPct };
  }
  // Red (0%) through yellow to green (100%).
  const progressColor = (pct) => `hsl(${Math.round(4 + pct * 1.3)} 72% 62%)`;

  // ---- History --------------------------------------------------------
  // Done items stay in the normal view for 7 days, then move to History. After 30 days the page
  // squeezes them into one archive doc per project and month (archive/<slug>--<YYYY-MM>) and
  // deletes the full card, so history stays browsable without filling the store.
  const isOld = (iso, now, days = SHOW_DAYS) => ts(iso) > 0 && now - ts(iso) > days * DAY;
  // Readable key plus a hash of the raw id, so ids that differ only in punctuation never collide.
  const hash = (s) => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0; return h.toString(36); };
  const itemKey = (kind, id) => `${kind}_${String(id).replace(/[^A-Za-z0-9_-]/g, "_").slice(0, 150)}_${hash(String(id))}`;
  // When a done item finished. Falls back so nothing is stuck in the "done" list forever.
  const streamDoneAt = (s) => (ts(s.updatedAt) ? s.updatedAt : s.lastShipped?.at || null);
  const needDoneAt = (n) => [n.doneAt, n.updatedAt, n.createdAt].find((x) => ts(x)) || null;
  function streamEntry(s) {
    const firstAt = (Array.isArray(s.recent) ? s.recent : []).map((r) => r && r.at).filter((a) => ts(a)).sort()[0] || null;
    return {
      kind: "stream", title: clip(s.title, 120) || "Workstream",
      summary: clip(s.lastShipped?.text) || clip(s.currentTask),
      url: safeUrl(s.lastShipped?.url) || safeUrl(s.pr?.url) || null,
      pr: s.pr && (s.pr.number || s.pr.url) ? { number: s.pr.number ?? null, url: safeUrl(s.pr.url), state: clip(s.pr.state, 20) } : null,
      agent: clip(s.agent, 60), startedAt: firstAt, finishedAt: streamDoneAt(s),
    };
  }
  function needEntry(n) {
    const a = n.answer || {};
    return {
      kind: "need", title: clip(n.title, 200) || "Untitled", needKind: clip(n.kind, 20),
      summary: clip([a.choice, a.note].filter(Boolean).join(" · ")) || null,
      url: safeUrl(n.link), doneBy: clip(n.doneBy, 20), startedAt: n.createdAt || null, finishedAt: needDoneAt(n),
    };
  }
  // A project's History: done items older than 7 days that are still stored, plus archived ones.
  function historyFor(data, slug, now) {
    const out = [];
    for (const s of rows(data, "streams")) if (s.project === slug && s.status === "done" && isOld(streamDoneAt(s), now)) out.push(streamEntry(s));
    for (const n of rows(data, "needs")) if (n.project === slug && n.done && isOld(needDoneAt(n), now)) out.push(needEntry(n));
    for (const doc of rows(data, "archive")) {
      if (doc.project !== slug || !doc.items || typeof doc.items !== "object") continue;
      for (const e of Object.values(doc.items)) if (e && typeof e === "object") out.push(e);
    }
    return out.sort((a, b) => ts(b.finishedAt) - ts(a.finishedAt));
  }
  // The fields that made a card archivable. The page re-reads each card just before deleting it
  // and keeps it if this changed meanwhile (another chat resumed the stream or reopened the need).
  const archiveStamp = (kind, d) => (!isObj(d) ? null
    : JSON.stringify(kind === "stream" ? [d.status, d.updatedAt ?? null] : [d.done, d.doneAt ?? null, d.updatedAt ?? null, d.answerState ?? null]));
  // What to archive: done items over 30 days old, grouped per project and month (UTC). Each group
  // is one archive doc (`archive/<id>`) and the cards to delete once it is written.
  function planArchive(data, now) {
    const monthOf = (iso) => new Date(ts(iso)).toISOString().slice(0, 7);
    const groups = new Map();
    const add = (slug, iso, key, entry, kind, doc) => {
      if (!slug || !/^[\w.-]+$/.test(slug)) return;
      const id = `${slug}--${monthOf(iso)}`;
      if (!groups.has(id)) groups.set(id, { id, slug, month: monthOf(iso), items: {}, cards: [] });
      const g = groups.get(id);
      g.items[key] = entry;
      g.cards.push({ kind, key, path: `${kind}s/${doc.id}`, stamp: archiveStamp(kind, doc) });
    };
    for (const s of rows(data, "streams")) {
      if (s.status === "done" && isOld(streamDoneAt(s), now, ARCHIVE_DAYS)) add(s.project, streamDoneAt(s), itemKey("stream", s.id), streamEntry(s), "stream", s);
    }
    for (const n of rows(data, "needs")) {
      if (n.done && isOld(needDoneAt(n), now, ARCHIVE_DAYS)) add(n.project, needDoneAt(n), itemKey("need", n.id), needEntry(n), "need", n);
    }
    return [...groups.values()];
  }

  // ---- Plan usage -----------------------------------------------------
  function readings(usage, key) {
    return (Array.isArray(usage) ? usage : [])
      .map((s) => ({ at: ts(s.at), pct: num(s[key]?.pct), resetsAt: ts(s[key]?.resetsAt) }))
      .filter((r) => r.at && r.pct != null && r.resetsAt)
      .sort((a, b) => a.at - b.at);
  }
  const sameWeek = (a, b) => Math.abs(a - b) < MINUTE;
  // Linear interpolation of a week's readings at a given offset from its start.
  function valueAt(week, weekStart, off) {
    const pts = [{ o: 0, p: 0 }, ...week.map((r) => ({ o: r.at - weekStart, p: r.pct }))];
    if (off <= 0) return 0;
    for (let i = 1; i < pts.length; i++) {
      if (pts[i].o >= off) {
        const a = pts[i - 1], b = pts[i];
        return a.p + ((b.p - a.p) * (off - a.o)) / Math.max(1, b.o - a.o);
      }
    }
    return null; // beyond the last reading
  }

  function projectWeek(usage, key, now) {
    const all = readings(usage, key);
    if (!all.length) return null;
    const latest = all[all.length - 1];
    const start = latest.resetsAt - WEEK;
    const week = all.filter((r) => sameWeek(r.resetsAt, latest.resetsAt));
    const lastWeek = all.filter((r) => sameWeek(r.resetsAt, latest.resetsAt - WEEK));
    const base = { pct: latest.pct, resetsAt: latest.resetsAt, at: latest.at, start, week, lastWeek, pace: Math.min(100, Math.max(0, ((now - start) / WEEK) * 100)) };
    if (latest.resetsAt <= now) return { ...base, kind: "reset" };
    const daysLeft = (latest.resetsAt - now) / DAY;
    base.perDay = daysLeft > 0.05 ? Math.max(0, 100 - latest.pct) / daysLeft : null;
    const elapsed = latest.at - start;

    // 1) Last week's rhythm: scale the rest of last week's curve by how this week compares so far.
    const lwStart = start - WEEK;
    const lwLast = lastWeek[lastWeek.length - 1];
    if (lastWeek.length >= 4 && lwLast && lwLast.at >= lwStart + WEEK - 12 * HOUR) {
      const lNow = valueAt(lastWeek, lwStart, elapsed);
      if (lNow != null && lNow >= 3 && latest.pct >= 2) {
        const ratio = latest.pct / lNow;
        const lEnd = lwLast.pct;
        const projected = latest.pct + ratio * Math.max(0, lEnd - lNow);
        let runOut = null;
        if (projected > 100) {
          for (let off = elapsed; off <= WEEK; off += HOUR) {
            const v = valueAt(lastWeek, lwStart, off);
            if (v != null && latest.pct + ratio * (v - lNow) >= 100) { runOut = start + off; break; }
          }
        }
        return { ...base, kind: projected > 100 ? "bad" : projected > 90 ? "warn" : "ok", projected, runOut, basis: "last week's rhythm" };
      }
    }
    if (elapsed < MIN_ELAPSED) return { ...base, kind: "early" };
    // 2) Straight line from the trailing ~36h, else the week so far.
    const from = [...week].reverse().find((r) => latest.at - r.at >= RATE_WINDOW);
    const rate = from ? (latest.pct - from.pct) / (latest.at - from.at) : latest.pct / elapsed;
    const projected = latest.pct + Math.max(0, rate) * (latest.resetsAt - latest.at);
    const runOut = rate > 0 && projected > 100 ? latest.at + (100 - latest.pct) / rate : null;
    return { ...base, kind: projected > 100 ? "bad" : projected > 90 ? "warn" : "ok", projected, runOut, basis: from ? "the last 36 hours" : "this week so far" };
  }
  // Readings old enough to delete.
  const staleReadings = (usage, now) => (Array.isArray(usage) ? usage : []).filter((s) => ts(s.at) && ts(s.at) < now - USAGE_KEEP_DAYS * DAY);

  // ---- Since you last looked ------------------------------------------
  // Every stream's `recent` rows, newest first, tagged with their project and stream.
  function allActivity(data, now) {
    const items = [];
    for (const p of orderedProjects(data, now)) {
      for (const s of p.streams) {
        for (const r of Array.isArray(s.recent) ? s.recent : []) {
          if (ts(r.at)) items.push({ ...r, project: p.id, projectName: p.name, stream: s.title });
        }
      }
    }
    return items.sort((a, b) => ts(b.at) - ts(a.at));
  }

  // What happened since the viewer last looked (`since`, ms), from data already on the page.
  function digestData(data, since, now) {
    const projects = orderedProjects(data, now);
    const streams = projects.flatMap((p) => p.streams.map((x) => ({ ...x, project: p.id, title: x.legacy ? p.name : x.title })));
    const finished = streams.filter((x) => ts(x.lastShipped?.at) > since || (x.status === "done" && ts(streamDoneAt(x)) > since))
      .map((x) => ({
        project: x.project, title: x.title || "Workstream", done: x.status === "done",
        text: x.lastShipped?.text || x.currentTask || "", url: safeUrl(x.lastShipped?.url) || safeUrl(x.pr?.url),
        at: ts(x.lastShipped?.at) > since ? x.lastShipped.at : streamDoneAt(x),
      }))
      .sort((m, n) => ts(n.at) - ts(m.at));
    // An agent usually also logs a ship in `recent`; don't show the same event twice.
    const shippedKeys = new Set(finished.flatMap((f) => [f.url && `u:${f.url}`, f.text && `t:${f.project}:${f.text}`]).filter(Boolean));
    const updates = allActivity(data, now).filter((r) => ts(r.at) > since && !shippedKeys.has(`u:${safeUrl(r.url)}`) && !shippedKeys.has(`t:${r.project}:${r.text}`));
    const byProject = new Map();
    for (const r of updates) {
      if (!byProject.has(r.project)) byProject.set(r.project, []);
      byProject.get(r.project).push(r);
    }
    // A chat counts as "gone quiet" here only if it went quiet after the viewer last looked.
    const quietFrom = (x) => ts(x.updatedAt) + (x.status === "waiting" ? WAITING_QUIET_AFTER : QUIET_AFTER);
    const needs = rows(data, "needs");
    return {
      updates, byProject, finished,
      newNeeds: needs.filter((n) => !n.done && !n.answer && ts(n.createdAt) > since).sort((m, n) => ts(n.createdAt) - ts(m.createdAt)),
      closed: needs.filter((n) => n.done && n.doneBy && n.doneBy !== "you" && ts(n.doneAt) > since).sort((m, n) => ts(n.doneAt) - ts(m.doneAt)),
      quiet: streams.map((x) => ({ x, q: quietness(x, now) })).filter((r) => r.q && quietFrom(r.x) > since),
    };
  }

  // ---- Services -------------------------------------------------------
  // services/<slug> lists the third-party services a project uses (see PROTOCOL.md). Money is never
  // converted: totals are kept per currency.
  const SERVICE_CATEGORY_LABEL = {
    payments: "Payments", database: "Databases", hosting: "Hosting", email: "Email", auth: "Auth", monitoring: "Monitoring",
    analytics: "Analytics", storage: "Storage", ai: "AI", messaging: "Messaging", search: "Search", maps: "Maps", cms: "CMS",
    media: "Media", captcha: "Captcha", ci: "CI", domain: "Domains", other: "Other",
  };
  const SERVICE_CATEGORIES = Object.keys(SERVICE_CATEGORY_LABEL);
  const serviceCategory = (item) => (Object.hasOwn(SERVICE_CATEGORY_LABEL, item?.category) ? item.category : "other");

  function formatMoney(amount, currency, locale = "en-US") {
    const whole = Number.isInteger(amount);
    try {
      return new Intl.NumberFormat(locale, { style: "currency", currency: String(currency).toUpperCase(), minimumFractionDigits: whole ? 0 : 2, maximumFractionDigits: 2 }).format(amount);
    } catch { return `${amount} ${currency}`; } // not a real currency code
  }
  // Totals as written by servicesSummary: [{ currency, monthly }], e.g. "$32 + SEK 199".
  const formatTotals = (totals, locale) => totals.map((t) => formatMoney(t.monthly, t.currency, locale)).join(" + ");

  // What a service costs per month right now: the newer of the collector's figure and the one the
  // viewer typed in. Null when neither is usable.
  function effectiveCost(item) {
    const found = [["manual", item?.manualCost], ["auto", item?.autoCost]].filter(([, c]) => validCost(c));
    if (!found.length) return null;
    const [source, c] = found.reduce((a, b) => (ts(b[1].at) > ts(a[1].at) ? b : a));
    return { monthly: c.monthly, currency: c.currency, at: c.at ?? null, source };
  }

  // Things worth a look for one service. "unknown" is soft: it is shown, but not counted as a warning.
  function serviceWarnings(item, now) {
    const cost = effectiveCost(item);
    const out = [];
    if (item?.removed === true) {
      if (cost && cost.monthly > 0) out.push({ kind: "removed-paid", text: `No longer found in the code but still costs ${formatMoney(cost.monthly, cost.currency)} a month` });
      return out;
    }
    if (!cost) return [{ kind: "unknown", soft: true, text: "Cost not set" }];
    const last = item.autoCost?.lastMonth;
    if (cost.source === "auto" && num(last) != null && cost.monthly > last * COST_INCREASE_RATIO && cost.monthly - last >= COST_INCREASE_MIN) {
      out.push({ kind: "increase", text: `Up from ${formatMoney(last, cost.currency)} to ${formatMoney(cost.monthly, cost.currency)} a month` });
    }
    if (ts(cost.at) && now - ts(cost.at) > COST_STALE_AFTER) out.push({ kind: "stale", text: `Cost not updated for ${Math.floor((now - ts(cost.at)) / DAY)} days` });
    return out;
  }

  // Paid first (dearest first), then free, then unknown, removed last.
  const serviceRank = (s) => (s.removed ? 3 : !s.cost ? 2 : s.cost.monthly > 0 ? 0 : 1);
  function addTotal(map, cost) {
    if (cost) map.set(cost.currency, (map.get(cost.currency) || 0) + cost.monthly);
  }
  const totalsOf = (map) => [...map].map(([currency, monthly]) => ({ currency, monthly: Math.round(monthly * 100) / 100 }))
    .sort((a, b) => (a.currency < b.currency ? -1 : a.currency > b.currency ? 1 : 0));

  // Everything the Services view shows: per project (in tab order) its sorted items, totals and
  // warnings, then the overall totals and warnings, and the same services grouped by provider.
  function servicesSummary(data, now) {
    const docs = rows(data, "services").filter((d) => isObj(d.items));
    const order = orderedProjects(data, now).map((p) => p.id);
    const nameOf = (slug) => rows(data, "projects").find((p) => p.id === slug)?.name || slug;
    const rank = (slug) => (order.includes(slug) ? order.indexOf(slug) : order.length);
    const providers = new Map();
    const all = new Map();
    const projects = [...docs].sort((a, b) => rank(a.id) - rank(b.id) || (a.id < b.id ? -1 : 1)).map((doc) => {
      const slug = doc.id, name = nameOf(slug);
      const items = Object.entries(doc.items).filter(([, v]) => isObj(v)).map(([id, v]) => ({
        id, name: clip(v.name, 80) || id, category: serviceCategory(v), purpose: clip(v.purpose), plan: clip(v.plan, 60),
        dashboardUrl: safeUrl(v.dashboardUrl), evidence: texts(v.evidence), envVars: texts(v.envVars),
        removed: v.removed === true, cost: effectiveCost(v), autoCost: validCost(v.autoCost) ? v.autoCost : null,
        manualCost: validCost(v.manualCost) ? v.manualCost : null, warnings: serviceWarnings(v, now),
      })).sort((a, b) => serviceRank(a) - serviceRank(b) || (b.cost?.monthly ?? 0) - (a.cost?.monthly ?? 0) || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0));
      const mine = new Map();
      const warnings = [];
      for (const s of items) {
        addTotal(mine, s.cost);
        addTotal(all, s.cost);
        for (const w of s.warnings) warnings.push({ ...w, project: slug, projectName: name, service: s.id, name: s.name });
        if (!providers.has(s.id)) providers.set(s.id, { id: s.id, name: s.name, category: s.category, projects: [], totals: new Map() });
        const prov = providers.get(s.id);
        prov.projects.push({ slug, name, removed: s.removed });
        addTotal(prov.totals, s.cost);
      }
      return {
        slug, name, items, totals: totalsOf(mine), warnings: warnings.filter((w) => !w.soft),
        unknown: warnings.filter((w) => w.soft).length, scannedAt: doc.scannedAt ?? null, updatedAt: doc.updatedAt ?? null,
      };
    });
    // Amounts in different currencies are added up here only to order the providers; never shown.
    const spend = (p) => p.totals.reduce((n, t) => n + t.monthly, 0);
    return {
      projects,
      totals: totalsOf(all),
      warnings: projects.flatMap((p) => p.warnings),
      unknown: projects.reduce((n, p) => n + p.unknown, 0),
      providers: [...providers.values()].map((p) => ({ ...p, totals: totalsOf(p.totals), removed: p.projects.every((x) => x.removed) }))
        .sort((a, b) => spend(b) - spend(a) || b.projects.length - a.projects.length || (a.name < b.name ? -1 : 1)),
    };
  }

  return {
    // tuning
    MINUTE, HOUR, DAY, WEEK, TICK, QUIET_AFTER, STOPPED_AFTER, WAITING_QUIET_AFTER, DIGEST_MIN_AGE, FEED_PAGE,
    SHOW_DAYS, ARCHIVE_DAYS, ARCHIVE_LEASE_MS, USAGE_KEEP_DAYS, RATE_WINDOW, MIN_ELAPSED, STUCK_AFTER, CLOCK_SKEW,
    COST_STALE_AFTER, COST_INCREASE_RATIO, COST_INCREASE_MIN,
    STATES, STATE_LABEL, SIZE_WEIGHT, SERVICE_CATEGORIES, SERVICE_CATEGORY_LABEL,
    // basics and incoming docs
    st, safeUrl, appUrl, ts, num, clip, isFuture, ago, span, normalize,
    // projects and streams
    streamsFor, allProjectSlugs, projectInfo, orderedProjects, quietness, streamCounts,
    // needs and progress
    isSnoozed, answerState, openNeeds, actionable, relayStuck, needsGroups, progressFor, progressColor,
    // history and archiving
    isOld, hash, itemKey, streamDoneAt, needDoneAt, streamEntry, needEntry, historyFor, archiveStamp, planArchive,
    // services
    validCost, serviceCategory, formatMoney, formatTotals, effectiveCost, serviceWarnings, servicesSummary,
    // plan usage
    readings, valueAt, projectWeek, staleReadings,
    // digest
    allActivity, digestData,
  };
})();
</script>

<script>
// ---- UI: DOM, live data and local storage ----
// Renders the board from the live `db` capability, using the pure functions of RelayCore above.
(() => {
  const {
    MINUTE, HOUR, DAY, WEEK, TICK, CLOCK_SKEW, DIGEST_MIN_AGE, FEED_PAGE, SHOW_DAYS, ARCHIVE_LEASE_MS, STATE_LABEL,
    st, safeUrl, appUrl, ts, num, isFuture, ago, span, normalize,
    orderedProjects, quietness, streamCounts, isSnoozed, answerState, actionable, relayStuck, needsGroups, progressFor, progressColor,
    isOld, streamDoneAt, historyFor, archiveStamp, planArchive, projectWeek, staleReadings, allActivity, digestData,
    SERVICE_CATEGORIES, SERVICE_CATEGORY_LABEL, formatMoney, formatTotals, servicesSummary,
  } = globalThis.RelayCore;
  const state = {
    projects: [], streams: [], needs: [], usage: [], archive: [], services: [],
    loaded: {}, fresh: {}, paused: false,
    view: "work", tab: "overview", db: null, ready: false,
    open: {}, drafts: {}, saving: {}, failed: {}, feedFilter: "all", feedLimit: FEED_PAGE,
  };

  // ---- Helpers --------------------------------------------------------

  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return n;
  };
  const link = (label, url) => (safeUrl(url) ? el("a", { href: url, target: "_blank", rel: "noopener" }, label) : el("span", {}, label));
  const nowIso = () => new Date().toISOString();
  // Render one card without letting a bad doc take down the whole page: on an error, show a small
  // placeholder in its place instead.
  const safely = (fn, tag, what) => (x, ...rest) => {
    try { return fn(x, ...rest); } catch (e) {
      console.warn(`Relay Board: couldn't show ${what} ${x?.id ?? ""}`, e);
      return el(tag, { class: "notice" }, `This ${what} couldn't be shown (${x?.id || "no id"}).`);
    }
  };
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  // ---- Fold state -----------------------------------------------------
  // Fold/unfold choices (sections, the usage chart, "Show N ..." lists) survive reloads.
  // Drafts and menus don't.
  const OPEN_KEY = "relay-open";
  const PERSIST = /^(sec:|stream:|finished-|history-|snoozed-|done-|removed-)/;
  try {
    const saved = JSON.parse(store.get(OPEN_KEY) || "{}");
    if (saved && typeof saved === "object") {
      for (const [k, v] of Object.entries(saved)) if (PERSIST.test(k) && typeof v === "boolean") state.open[k] = v;
    }
  } catch {}
  const isOpen = (key, def = false) => (Object.hasOwn(state.open, key) ? !!state.open[key] : def);
  const toggleId = (key) => `tg-${key.replace(/[^\w-]/g, "-")}`;
  function setOpen(key, open) {
    state.open[key] = open;
    const keep = Object.fromEntries(Object.entries(state.open).filter(([k]) => PERSIST.test(k)));
    store.set(OPEN_KEY, JSON.stringify(keep));
  }
  function toggleOpen(key, def = false) {
    setOpen(key, !isOpen(key, def));
    render();
  }
  // A foldable section header: chevron, title, rule and count, all one button.
  function sectionHead(key, id, title, count, def = true) {
    const open = isOpen(key, def);
    const h = el("h2", { class: "eyebrow", id },
      el("button", { type: "button", class: "eyebrow-btn", id: toggleId(key), "aria-expanded": String(open), onclick: () => toggleOpen(key, def) },
        el("span", { class: "chev", "aria-hidden": "true" }, "\u25BE"), title, el("span", { class: "rule" }),
        count != null ? el("span", { class: "mono" }, count) : null));
    return { h, open };
  }

  const FUTURE_NOTE = "This time is ahead of now: the chat that wrote it has the wrong date or clock.";
  const timeEl = (iso) => {
    const future = isFuture(iso, Date.now());
    return el("time", { datetime: iso || "", class: `mono${future ? " future" : ""}`, title: future ? FUTURE_NOTE : iso ? new Date(iso).toLocaleString() : "" }, ago(iso, Date.now()));
  };
  const clock = (ms) => new Date(ms).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  const whenLabel = (ms) => {
    const d = new Date(ms);
    const sameDay = new Date().toDateString() === d.toDateString();
    return sameDay ? `today ${clock(ms)}` : `${d.toLocaleDateString(undefined, { weekday: "short" })} ${clock(ms)}`;
  };

  let toastTimer;
  function showToast(msg) {
    const t = $("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 4500);
  }
  // Saves a change and returns null, or the reason it failed (also shown as a toast).
  async function save(path, data, okMsg) {
    if (!state.db) return "Live data isn't available in this view.";
    try {
      await state.db.doc(path).update(data);
      if (okMsg) showToast(okMsg);
      return null;
    } catch (e) {
      const why = e?.code === "invalid_argument" ? "You can view this board but not change it." : "That didn't save. Try again in a moment.";
      showToast(why);
      return why;
    }
  }
  const write = async (path, data, okMsg) => !(await save(path, data, okMsg));

  // ---- Needs ----------------------------------------------------------
  const projectName = (slug) => state.projects.find((p) => p.id === slug)?.name || slug;
  const projectChip = (slug) => (!slug ? null : el("button", {
    type: "button", class: "chip project", onclick: (e) => { e.stopPropagation(); setTab(slug); },
  }, projectName(slug)));
  const KIND_LABEL = { approval: "Approval", decision: "Decision", task: "Manual task" };
  const GROUP_LABEL = { approval: "Approvals", decision: "Decisions", task: "Tasks for you" };

  // Every change to a need (or a service cost) goes through here: one save at a time per item, its
  // buttons disabled while it saves, and a failure shown on the item itself (not only in the toast).
  async function guardedSave(key, path, patch, okMsg) {
    if (state.saving[key]) return false;
    state.saving[key] = true;
    delete state.failed[key];
    render();
    const why = await save(path, patch, okMsg);
    delete state.saving[key];
    if (why) state.failed[key] = why;
    render();
    return !why;
  }
  const needWrite = (n, patch, okMsg) => guardedSave(n.id, `needs/${n.id}`, patch, okMsg);
  async function answerNeed(n, choice) {
    const note = (state.drafts[n.id] || "").trim();
    if (!choice && !note) { showToast("Write an answer first."); return; }
    const patch = {
      answer: { choice: choice || null, note: note || null, at: nowIso() },
      answerState: "answered",
    };
    if (n.kind === "task" && choice === "Done") Object.assign(patch, { done: true, doneAt: nowIso(), doneBy: "you" });
    if (await needWrite(n, patch, "Saved. The chat picks it up at the next board check.")) {
      delete state.drafts[n.id]; state.open[`reply-${n.id}`] = false; render();
    }
  }
  const changeAnswer = (n) => needWrite(n, { answer: null, answerState: null });
  // Put a stuck answer back to "answered" so the next chat that checks the board relays it again.
  const sendAgain = (n) => needWrite(n, { answerState: "answered", relayedAt: null }, "The next chat to check the board will pass it on.");
  const closeNeed = (n) => needWrite(n, { done: true, doneAt: nowIso(), doneBy: "you" }, "Marked done.");
  // Reopening starts a fresh round: the old answer is kept for reference but no longer counts.
  const reopenNeed = (n) => needWrite(n, {
    done: false, doneAt: null, doneBy: null, answer: null, answerState: null, relayedAt: null,
    ...(n.answer ? { previousAnswer: n.answer } : {}),
  });
  function snooze(n, until) {
    state.open[`snooze-${n.id}`] = false;
    needWrite(n, { snoozedUntil: until ? new Date(until).toISOString() : null }, until ? `Snoozed until ${whenLabel(until)}.` : "Back in the list.");
  }
  const tomorrowMorning = () => { const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(8, 0, 0, 0); return d.getTime(); };

  function answerControls(n) {
    const box = el("div", { class: "answer" });
    const choices = Array.isArray(n.options) && n.options.length ? n.options
      : n.kind === "approval" ? ["Approve", "Decline"] : n.kind === "task" ? ["Done"] : [];
    const row = el("div", { class: "btn-row" });
    for (const c of choices) {
      const cls = /^(approve|done|yes)\b/i.test(c) ? "btn good" : /^(decline|no|reject)\b/i.test(c) ? "btn danger" : "btn";
      row.append(el("button", { type: "button", class: cls, onclick: () => answerNeed(n, c) }, c));
    }
    const replyKey = `reply-${n.id}`;
    row.append(el("button", { type: "button", class: "btn ghost", "aria-expanded": String(!!state.open[replyKey]), onclick: () => { state.open[replyKey] = !state.open[replyKey]; render(); } },
      choices.length ? "Add a note" : "Reply"));
    const snoozeKey = `snooze-${n.id}`;
    if (state.open[snoozeKey]) {
      row.append(el("span", { class: "snooze-menu" },
        el("button", { type: "button", class: "btn ghost", onclick: () => snooze(n, Date.now() + 3 * HOUR) }, "3 hours"),
        el("button", { type: "button", class: "btn ghost", onclick: () => snooze(n, tomorrowMorning()) }, "Tomorrow 08:00"),
        el("button", { type: "button", class: "btn ghost", onclick: () => snooze(n, Date.now() + WEEK) }, "1 week")));
    } else {
      row.append(el("button", { type: "button", class: "btn ghost", onclick: () => { state.open[snoozeKey] = true; render(); } }, "Snooze"));
    }
    if (n.kind !== "task") row.append(el("button", { type: "button", class: "btn ghost", title: "Close without sending anything to the chat", onclick: () => closeNeed(n) }, "Close"));
    box.append(row);
    if (state.open[replyKey]) {
      const id = `draft-${n.id}`;
      const ta = el("textarea", { id, "aria-label": `Answer for ${n.title}`, placeholder: choices.length ? "Optional note for the chat" : "Your answer. The chat reads this and continues." });
      ta.value = state.drafts[n.id] || "";
      ta.addEventListener("input", (e) => { state.drafts[n.id] = e.target.value; });
      box.append(ta);
      box.append(el("div", { class: "btn-row" },
        el("button", { type: "button", class: "btn primary", onclick: () => answerNeed(n, null) }, choices.length ? "Send note only" : "Send answer"),
        choices.length ? el("span", { class: "dim-text" }, "or pick a button above to send it with your note") : null));
    }
    return box;
  }

  function answeredLine(n) {
    const a = n.answer || {};
    const s = answerState(n);
    const stuck = relayStuck(n, Date.now());
    const sent = ts(n.relayedAt) ? `Sent to the chat ${ago(n.relayedAt, Date.now())}` : "Sent to the chat";
    const status = s === "handled" ? "Chat handled it" : stuck ? `${sent}, but it hasn't confirmed` : s === "relayed" ? sent : "Waiting for a chat to pick it up";
    return el("div", { class: "answered" },
      el("span", { class: "you" }, "You answered"),
      a.choice ? el("strong", {}, a.choice) : null,
      a.note ? el("q", {}, a.note) : null,
      el("span", { class: stuck ? "stuck" : "dim-text" }, `· ${status}`),
      s === "answered" ? el("button", { type: "button", class: "btn ghost", onclick: () => changeAnswer(n) }, "Change") : null,

  function renderNeedItem(n, showProject) {
    const li = el("li", { class: `need${n.done ? " done" : ""}` });

    li.append(el("div", { class: "need-head" },

  const needItem = safely(renderNeedItem, "li", "item");

  function collapsible(key, label, items, showProject) {

  function needsPanel(slug) {

    const sec = el("section", { "aria-labelledby": `needs-h-${slug || "all"}` });

  // ---- Since you last looked ------------------------------------------
  const SEEN_KEY = "relay-last-seen";
  let lastSeen = Number(store.get(SEEN_KEY)) || 0;
  if (!lastSeen) { lastSeen = Date.now(); store.set(SEEN_KEY, String(lastSeen)); }
  function markSeen() { lastSeen = Date.now(); store.set(SEEN_KEY, String(lastSeen)); render(); }
  let visibleSince = Date.now();
  document.addEventListener("visibilitychange", () => {

  // The "Since you last looked" strip, from digestData(). Folded by default; every fact says what

  function digest() {

    const d = digestData(state, since, Date.now());
    const nUpd = d.updates.length;
    if (!nUpd && !d.newNeeds.length && !d.finished.length && !d.closed.length && !d.quiet.length) return null;
    const key = "sec:digest";
    const open = isOpen(key, false);
    const toggle = () => toggleOpen(key, false);
    const fact = (n, label, extra, cls = "") => (!n ? null
      : el("span", { class: `fact ${cls}` }, el("b", {}, n), ` ${label}`, extra ? el("span", { class: "dim-text" }, ` ${extra}`) : null));

          fact(d.newNeeds.length, "new for you", null, "you"),
          fact(d.finished.length, d.finished.every((f) => f.done) ? "finished" : "shipped", null, "fin"),
          fact(nUpd, plural(nUpd, "update", "updates"), `in ${listNames([...d.byProject.keys()])}`),

      el("h3", { class: "n-group-h" }, title, el("span", { class: "mono dim-text" }, count)), el("ul", { class: "d-list" }, items))) : null;
    const when = (iso) => {

      el("ul", { class: "d-sub" }, rows.map((r) => el("li", {}, when(r.at),

    group("Updates by project", nUpd, upd);

      el("span", { class: `chip ${q.cls}` }, q.label), projectChip(x.project), el("span", {}, x.title || "Workstream"))));
    sec.append(body);

  // ---- Activity feed --------------------------------------------------
  function dayLabel(d) {
    if (d.getTime() > Date.now() + CLOCK_SKEW) return "Ahead of now: wrong date or clock";
    if (d.toDateString() === new Date().toDateString()) return "Today";
    if (d.toDateString() === new Date(Date.now() - DAY).toDateString()) return "Yesterday";
    return d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "short" });
  }
  function activityPanel() {
    const all = allActivity(state, Date.now());
    if (!all.length) return null;
    const sec = el("section", { "aria-labelledby": "act-h" });

    const slugs = [...new Set(all.map((r) => r.project))];
    const filters = el("div", { class: "filters", role: "group", "aria-label": "Filter activity by project" },
      el("button", { type: "button", "aria-pressed": String(state.feedFilter === "all"), onclick: () => { state.feedFilter = "all"; render(); } }, "All"),
      slugs.map((s) => el("button", { type: "button", "aria-pressed": String(state.feedFilter === s), onclick: () => { state.feedFilter = s; render(); } }, projectName(s))));
    panel.append(filters);

    const feed = el("ul", { class: "feed" });
    let day = "";
    for (const r of rows.slice(0, state.feedLimit)) {
      const d = new Date(ts(r.at));
      const label = dayLabel(d);

        el("time", { class: `mono${future ? " future" : ""}`, datetime: r.at, title: future ? FUTURE_NOTE : d.toLocaleString() }, clock(ts(r.at))),
        el("span", { class: "chip project" }, r.projectName),
        el("span", {}, r.url ? link(r.text, r.url) : r.text)));

  // ---- Project cards --------------------------------------------------
  const CI_LABEL = { pass: "CI passing", fail: "CI failing", running: "CI running" };

  }
  function renderProjectCard(p) {

        el("div", { class: "btn-row" },
          el("button", { type: "button", class: "pin", "aria-pressed": String(!!p.pinned), title: p.pinned ? "Unpin" : "Pin to top", onclick: () => togglePin(p) }, p.pinned ? "Pinned" : "Pin"),
          el("span", { class: "chip state" }, p.complete ? ["All done ", el("span", { "aria-hidden": "true" }, "✦")] : STATE_LABEL[s]))),

      shipped ? el("div", { class: "shipped" }, el("b", {}, "Shipped "), shipped.url ? link(shipped.text, shipped.url) : shipped.text, " ", timeEl(shipped.at)) : null,

        el("span", {}, needCount ? `${needCount} need you · ` : "", timeEl(p.updatedAt))));

  const projectCard = safely(renderProjectCard, "article", "project");

  function overview() {

  // ---- Project view ---------------------------------------------------
  function renderStreamPanel(s) {
    const ss = st(s.status);
    const q = quietness(s, Date.now());
    const steps = Array.isArray(s.steps) ? s.steps : [];
    const done = steps.filter((x) => x.state === "done").length;
    const session = s.session || {};
    const chatLink = appUrl(session.link);
    const key = `stream:${s.id || s.title}`;

    const bodyId = `${toggleId(key)}-body`;
    const panel = el("section", { class: `panel stream s-${ss}`, "aria-label": s.title || "Workstream" });
    const chips = el("div", { class: "btn-row" }, q ? el("span", { class: `chip ${q.cls}` }, q.label) : null, el("span", { class: "chip state" }, STATE_LABEL[ss]));
    const toggle = el("button", { type: "button", class: "stream-toggle", id: toggleId(key), "aria-expanded": String(open), onclick: () => toggleOpen(key, true) },
      el("span", { class: "chev", "aria-hidden": "true" }, "\u25BE"), s.title || "Workstream");

      session.title ? el("span", {}, "Chat: ", chatLink ? el("a", { href: chatLink, title: "Opens the chat in the Claude app" }, session.title) : el("span", { class: "mono" }, session.title)) : null,

    else left.append(el("ol", { class: "steps" }, steps.map((x) => {

      return el("li", { class: `step s-${xs}` },
        el("span", { class: "mark", "aria-hidden": "true" }),
        el("span", {}, el("span", { class: "step-title" }, x.link ? link(x.title, x.link) : x.title), x.note ? el("span", { class: "step-note" }, x.note) : null),
        el("span", { class: "btn-row" }, x.by === "you" && xs !== "done" ? el("span", { class: "chip you" }, "You") : null, el("span", { class: "chip state" }, STATE_LABEL[xs])));
    })));
    cols.append(left);

      el("div", { class: "blockers" }, blockers.map((x) => el("div", { class: `callout${x.severity === "high" ? " bad" : ""}` }, x.text)))));
    const links = Array.isArray(s.links) ? s.links.filter((l) => safeUrl(l.url)) : [];
    if (links.length) side.append(el("div", {}, el("h4", { class: "sub-h" }, "Links"), el("div", { class: "links" }, links.map((x) => link(x.label, x.url)))));
    const recent = Array.isArray(s.recent) ? s.recent.slice(0, 15) : [];
    side.append(el("div", {}, el("h4", { class: "sub-h" }, "Recently finished"),

        : el("p", { class: "empty" }, "Nothing yet.")));
    cols.append(side);
    body.append(cols);
    return panel;
  }

  const streamPanel = safely(renderStreamPanel, "section", "workstream");

  function projectView(p) {
    const frag = document.createDocumentFragment();
    const s = st(p.status);
    frag.append(el("section", { class: "proj-head" },
      el("div", {},
        el("h2", {}, p.name),

          p.repo ? link(p.repo, safeUrl(p.repoUrl) || null) : null,

        el("span", { class: `chip state s-${s}` }, el("span", { class: "dot state" }), STATE_LABEL[s]))));
